<app-header
  title="Clientes"
  [navigationMenus]="[
    { label: 'Home', link: '/home' },
    { label: 'Clientes', link: '' },
  ]"
></app-header>

<div class="app-content">
  <app-grid
    [className]="'Clientes'"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [baseEndPoint]="'clients'"
    [refresh]="refreshClients.bind(this)"
    [delete]="deleteClient.bind(this)"
    (openModal)="onOpenModal($event)"
  ></app-grid>
</div>
