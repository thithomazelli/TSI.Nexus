<app-header
  [title]="'SIDEBAR.ALERTAS' | translate"
  [navigationMenus]="[
    { label: 'COMMON.HOME' | translate, link: '/home' },
    { label: 'SIDEBAR.ALERTAS' | translate, link: '' },
  ]"
></app-header>

<div class="app-content">
  <div class="card card-secondary card-outline">
    <div class="card-body">
      <p class="text-muted">
        {{ 'ALERT_CONFIGS.DESCRIPTION' | translate }}
      </p>

      <div *ngIf="loading" class="text-center py-4">
        <i class="bi bi-arrow-repeat"></i>{{ 'COMMON.LOADING' | translate }}</div>

      <div *ngIf="!loading && alerts.length === 0" class="text-muted py-3">
        {{ 'ALERT_CONFIGS.NO_ALERTS_FOUND' | translate }}
      </div>

      <ul *ngIf="!loading" class="list-group list-group-flush">
        <li
          *ngFor="let alertConfig of alerts"
          class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2"
        >
          <div>
            <div class="fw-bold">{{ alertConfig.name }}</div>
            <div class="text-muted small">{{ alertConfig.description }}</div>
          </div>
          <div class="d-flex align-items-center gap-3">
            <div
              *ngIf="alertConfig.thresholdDays != null"
              class="input-group input-group-sm"
              style="width: 160px"
            >
              <input
                type="number"
                min="1"
                class="form-control"
                [(ngModel)]="alertConfig.thresholdDays"
                [disabled]="savingKey === alertConfig.key || !alertConfig.enabled"
              />
              <span class="input-group-text">{{ 'ALERT_CONFIGS.DAYS_SUFFIX' | translate }}</span>
              <button
                type="button"
                class="btn btn-outline-secondary"
                [disabled]="savingKey === alertConfig.key || !alertConfig.enabled"
                (click)="saveThreshold(alertConfig)"
              >
                <i class="bi bi-check-lg"></i>
              </button>
            </div>
            <div class="form-check form-switch fs-4 mb-0">
              <input
                class="form-check-input"
                type="checkbox"
                role="switch"
                [checked]="alertConfig.enabled"
                [disabled]="savingKey === alertConfig.key"
                (change)="toggle(alertConfig)"
              />
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
