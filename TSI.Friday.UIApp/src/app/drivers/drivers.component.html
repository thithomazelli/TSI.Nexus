<app-header
  [title]="'SIDEBAR.DRIVERS' | translate"
  [navigationMenus]="[
    { label: 'COMMON.HOME' | translate, link: '/home' },
    { label: 'SIDEBAR.DRIVERS' | translate, link: '' },
  ]"
></app-header>

<div class="app-content">
  <app-grid
    [baseEndPoint]="baseEndPoint"
    [className]="'SIDEBAR.DRIVERS' | translate"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [refresh]="refreshDrivers.bind(this)"
    [delete]="deleteDriver.bind(this)"
    (openModal)="openModal($event)"
  ></app-grid>
</div>
