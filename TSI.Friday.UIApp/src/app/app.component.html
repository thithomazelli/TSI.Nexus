<!--begin::App Wrapper-->
<div [ngClass]="(isLoggedIn$ | async) ? 'app-wrapper' : 'login-box'">
  @if (isLoggedIn$ | async) {
    <!--begin::Header-->
    <app-navbar class="app-header main-header"></app-navbar>
    <!--end::Header-->
    <!--begin::Sidebar-->
    <app-sidebar
      class="app-sidebar main-sidebar bg-body-secondary shadow elevation-4"
      data-bs-theme="dark"
    ></app-sidebar>
  }
  <!--end::Sidebar-->
  <!--begin::App Main-->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
  <!--end::App Main-->
  @if (isLoggedIn$ | async) {
    <!--begin::Footer-->
    <footer class="app-footer">
      <!--begin::To the end-->
      <div class="float-end d-none d-sm-inline">Anything you want</div>
      <!--end::To the end-->
      <!--begin::Copyright-->
      <strong>
        Copyright &copy; 2014-2025&nbsp;
        <a href="https://adminlte.io" class="text-decoration-none"
          >AdminLTE.io</a
          >.
        </strong>
        All rights reserved.
        <!--end::Copyright-->
      </footer>
    }
    <!--end::Footer-->
  </div>
  <!--end::App Wrapper-->
