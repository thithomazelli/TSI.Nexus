<a class="nav-link" data-bs-toggle="dropdown" href="#" title="Licenças de veículo a vencer">
  <i class="bi bi-patch-check"></i>
  <span *ngIf="showBadge" class="navbar-badge badge text-bg-danger">{{
    total
  }}</span>
</a>
<div class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
  <span class="dropdown-item dropdown-header"
    >{{ total }} licença(s) NTT/ARTESP a vencer</span
  >
  <div class="dropdown-divider" *ngIf="showBadge"></div>
  <ng-container *ngFor="let vehicle of vehicles">
    <a
      href="#"
      class="dropdown-item px-2 py-2"
      (click)="openVehicle(vehicle); $event.preventDefault()"
    >
      <div class="d-flex justify-content-between align-items-center w-100 small">
        <span class="fw-semibold">{{ vehicle.plate }}</span>
        <span [class.text-danger]="isExpired(vehicle)">
          {{ vehicle.transportLicenseExpiryDate | date: 'dd/MM/yyyy' }}
        </span>
      </div>
    </a>
    <div class="dropdown-divider"></div>
  </ng-container>
  <a href="#" class="dropdown-item dropdown-footer" routerLink="/vehicles"
    >Ver frota</a
  >
</div>
