<a
  class="nav-link"
  data-bs-toggle="dropdown"
  href="#"
  [title]="'NAVBAR.LICENSE_EXPIRY_TITLE' | translate"
>
  <i class="bi bi-person-vcard"></i>
  <span *ngIf="showBadge" class="navbar-badge badge text-bg-danger">{{
    total
  }}</span>
</a>
<div class="dropdown-menu dropdown-menu-lg dropdown-menu-end">
  <span class="dropdown-item dropdown-header">{{ total }} {{ 'NAVBAR.LICENSE_EXPIRY_HEADER' | translate }}</span>
  <div class="dropdown-divider" *ngIf="showBadge"></div>
  <ng-container *ngFor="let driver of drivers">
    <a
      href="#"
      class="dropdown-item px-2 py-2"
      (click)="openDriver(driver); $event.preventDefault()"
    >
      <div class="d-flex justify-content-between align-items-center w-100 small">
        <span class="fw-semibold">{{ driver.name }}</span>
        <span [class.text-danger]="isExpired(driver)">
          {{ driver.licenseExpiryDate | date: 'dd/MM/yyyy' }}
        </span>
      </div>
    </a>
    <div class="dropdown-divider"></div>
  </ng-container>
  <a href="#" class="dropdown-item dropdown-footer" routerLink="/drivers"
    >{{ 'NAVBAR.SEE_DRIVERS' | translate }}</a
  >
</div>
