<div class="modal-header">
  <h5 class="modal-title">
    {{ isEdit ? "Edit Product" : "Add Product" }}
  </h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <app-product-form
    [isEdit]="isEdit"
    [data]="data"
    (save)="save($event)"
    (cancel)="close()"
    [compact]="false"
  ></app-product-form>
</div>
