<app-header
  title="Produtos"
  [navigationMenus]="[
    { label: 'COMMON.HOME' | translate, link: '/home' },
    { label: 'Produtos', link: '' },
  ]"
></app-header>

<div class="app-content">
  <app-grid
    [baseEndPoint]="baseEndPoint"
    [className]="'Produtos'"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [refresh]="refreshProducts.bind(this)"
    [delete]="deleteProduct.bind(this)"
    (openModal)="openModal($event)"
  ></app-grid>
</div>
