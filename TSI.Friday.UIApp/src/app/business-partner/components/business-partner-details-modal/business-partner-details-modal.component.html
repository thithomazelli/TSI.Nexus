<div class="modal-header">
  <h5 class="modal-title">
    {{ isEdit ? "Editar Cliente" : "Adicionar Cliente" }}
  </h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <app-business-partner-form
    [isEdit]="isEdit"
    [isModal]="true"
    [data]="data"
    (save)="save($event)"
    (cancel)="close()"
    [compact]="true"
    [errors]="errorMessages"
  ></app-business-partner-form>
</div>
