<app-header
  *ngIf="!compact"
  title="Relatório de Produtos do Pedido"
  [navigationMenus]="[
    { label: 'Home', link: '/home' },
    { label: 'Relatório de Produtos do Pedido', link: '' },
  ]"
></app-header>

<div class="app-content">
  <app-grid
    [className]="'Produtos do Pedido'"
    [compactView]="compact"
    [rowData]="filteredRowData"
    [columnDefs]="columnDefs"
    [baseEndPoint]="baseEndPoint"
    [refresh]="refreshOrderProducts.bind(this)"
    [delete]="deleteOrderProduct.bind(this)"
    [update]="updateOrderProductStatus.bind(this)"
    (openModal)="onOpenModal($event)"
    [filtersTemplate]="filtersTpl"
    [canAdd]="!isFullList"
    [showFilters]="showFiltersOnInit"
  ></app-grid>

  <ng-template #filtersTpl>
    <div class="row g-2 mb-2">
      <div class="date-filter-area">
        <app-date-field
          [(ngModel)]="filterStartDate"
          (ngModelChange)="applyFilters()"
          label="Início"
        ></app-date-field>
      </div>
      <div class="date-filter-area">
        <app-date-field
          [(ngModel)]="filterEndDate"
          (ngModelChange)="applyFilters()"
          label="Fim"
        ></app-date-field>
      </div>
      <div class="col-auto d-flex align-items-center gap-2">
        <div class="filter-group-box position-relative">
          <span class="filter-group-label">Status</span>
          <div class="d-flex align-items-center pt-2">
            <label class="form-check-label ms-2">
              <input
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="filterStatus.InProgress"
                (change)="applyFilters()"
              />
              Vigente
            </label>
            <label class="form-check-label ms-2">
              <input
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="filterStatus.Delayed"
                (change)="applyFilters()"
              />
              Atrasado
            </label>
            <label class="form-check-label ms-2">
              <input
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="filterStatus.Returned"
                (change)="applyFilters()"
              />
              Devolvido
            </label>
          </div>
        </div>
        <button class="btn btn-secondary" (click)="clearFilters()">
          Limpar
        </button>
      </div>
    </div>
  </ng-template>
</div>
