<div class="order-product-form-wrapper" [ngClass]="{ compact: compact }">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row g-2 mb-1">
      <div class="col-6">
        <div class="input-group position-relative">
          <div class="form-floating flex-grow-1">
            <input
              type="text"
              formControlName="productSku"
              class="form-control"
              [matAutocomplete]="skuAuto"
              #firstInput
              [class.is-invalid]="isInvalid('productSku')"
              placeholder="SKU"
              (blur)="onProductSkuBlur()"
            />
            <label for="productSku">SKU</label>
            <mat-autocomplete
              #skuAuto="matAutocomplete"
              (optionSelected)="selectProduct($event.option.value)"
            >
              <mat-option
                *ngFor="let product of filteredProductsSku$ | async"
                [value]="product"
              >
                {{ product.sku }}
              </mat-option>
            </mat-autocomplete>
          </div>
          <div class="input-group-text"><i class="bi bi-upc"></i></div>
        </div>
      </div>
      <div class="col-6">
        <div class="input-group mb-1 position-relative">
          <div class="form-floating flex-grow-1">
            <input
              type="text"
              formControlName="productName"
              class="form-control"
              [class.is-invalid]="isInvalid('productName')"
              placeholder="Nome do Produto"
              [matAutocomplete]="nameAuto"
              (blur)="onProductNameBlur()"
            />
            <label for="productName">Nome do Produto</label>
            <mat-autocomplete
              #nameAuto="matAutocomplete"
              (optionSelected)="selectProduct($event.option.value)"
            >
              <mat-option
                *ngFor="let product of filteredProductsName$ | async"
                [value]="product"
              >
                {{ product.name }}
              </mat-option>
            </mat-autocomplete>
          </div>
          <div class="input-group-text"><i class="bi bi-tag"></i></div>
        </div>
      </div>
    </div>

    <div class="input-group mb-1">
      <div class="form-floating flex-grow-1">
        <input
          formControlName="description"
          type="text"
          placeholder="Descrição"
          class="form-control"
          [class.is-invalid]="isInvalid('description')"
        />
        <label for="description">Descrição</label>
      </div>
      <div class="input-group-text"><i class="bi bi-box"></i></div>
    </div>

    <div class="row g-2 mb-1">
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-grow-1">
            <input
              formControlName="quantity"
              type="number"
              min="1"
              placeholder="Quantidade"
              class="form-control"
              [class.is-invalid]="isInvalid('quantity')"
              (blur)="onQuantityBlur()"
            />
            <label for="quantity">Quantidade</label>
          </div>
          <div class="input-group-text"><i class="bi bi-123"></i></div>
        </div>
      </div>
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-grow-1">
            <input
              formControlName="priceFormatted"
              type="text"
              placeholder="Preço Sugerido"
              class="form-control"
              [class.is-invalid]="isInvalid('priceFormatted')"
              (blur)="onPriceBlur()"
            />
            <label for="price">Preço Sugerido</label>
          </div>
          <div class="input-group-text">
            <i class="bi bi-cash-coin"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="row g-2 mb-1">
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-grow-1">
            <input
              formControlName="discount"
              type="number"
              min="0"
              max="100"
              step="0.01"
              placeholder="Desconto"
              class="form-control"
              [class.is-invalid]="isInvalid('discount')"
            />
            <label for="discount">Desconto</label>
          </div>
          <div class="input-group-text"><i class="bi bi-percent"></i></div>
        </div>
      </div>
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-grow-1">
            <input
              formControlName="totalPriceFormatted"
              type="text"
              placeholder="Preço Total"
              class="form-control"
              [class.is-invalid]="isInvalid('totalPriceFormatted')"
            />
            <label for="totalPrice">Preço Total</label>
          </div>
          <div class="input-group-text">
            <i class="bi bi-cash-coin"></i>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-3 gap-2">
      <button type="button" class="btn btn-secondary" (click)="onCancel()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-success" [disabled]="form.invalid">
        {{ isEdit ? "Salvar" : "Adicionar" }}
      </button>
    </div>
  </form>
</div>
