<div class="modal-header">
  <h5 class="modal-title">
    {{ (isEdit ? "TRIPS.EDIT_DRIVER_ITEM" : "TRIPS.ADD_DRIVER_ITEM") | translate }}
  </h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <app-trip-driver-form
    [isModal]="true"
    [isEdit]="isEdit"
    [data]="data"
    [dialogRef]="dialogRef"
    [parentId]="parentId"
    [parentData]="parentData"
    [compact]="false"
  ></app-trip-driver-form>
</div>
