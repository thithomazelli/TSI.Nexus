<div class="trip-form-wrapper custom-modal">
  @if (isEdit) {
    <app-alert-banner-component
      [status]="data?.status"
      [entity]="'SIDEBAR.TRIPS' | translate"
    ></app-alert-banner-component>
  }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="modal-scrollable-area">
      <section>
        <div class="row g-1 mb-1">
          <div *ngIf="isEdit" class="col-12 col-md-4">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="tripNumber"
                  type="text"
                  [placeholder]="'TRIPS.TRIP_NUMBER' | translate"
                  class="form-control"
                  [class.is-invalid]="isInvalid('tripNumber')"
                  [class.is-valid]="isValid('tripNumber')"
                />
                <label for="tripNumber">{{ 'TRIPS.TRIP_NUMBER' | translate }}</label>
              </div>
              <div class="input-group-text"><i class="bi bi-hash"></i></div>
            </div>
          </div>

          <div class="col-12" [ngClass]="isEdit ? 'col-md-8' : 'col-md-12'">
            <div class="input-group">
              <div class="form-floating">
                @if (!isEdit) {
                  <input
                    type="text"
                    formControlName="businessPartnerName"
                    class="form-control"
                    [matAutocomplete]="auto"
                    #firstInput
                    [class.is-invalid]="isInvalid('businessPartnerName')"
                    [class.is-valid]="isValid('businessPartnerName')"
                    [placeholder]="'BUSINESS_PARTNER.CLIENT_SINGULAR' | translate"
                    (blur)="onClientBlur()"
                  />
                  <label for="businessPartnerName">{{ 'BUSINESS_PARTNER.CLIENT_SINGULAR' | translate }}</label>
                  <mat-autocomplete #auto="matAutocomplete">
                    <mat-option
                      *ngFor="
                        let businessPartner of filteredBusinessPartners$ | async
                      "
                      [value]="businessPartner.name"
                    >
                      {{ businessPartner.name }}
                    </mat-option>
                  </mat-autocomplete>
                } @else {
                  <app-link-field
                    [placeHolder]="'BUSINESS_PARTNER.CLIENT_SINGULAR' | translate"
                    [text]="
                      form.get('businessPartnerName')?.value ||
                      ('BUSINESS_PARTNER.CLIENT_SINGULAR' | translate)
                    "
                    [linkUrl]="[
                      '/clients',
                      form.get('businessPartnerId')?.value,
                    ]"
                  >
                  </app-link-field>
                }
              </div>
              <div class="input-group-text"><i class="bi bi-building"></i></div>
            </div>
          </div>

          <div *ngIf="data?.quoteNumber != null" class="col-md-12">
            <div class="input-group">
              <div class="form-floating">
                <app-link-field
                  [placeHolder]="'SIDEBAR.QUOTES' | translate"
                  [text]="
                    form.get('quoteNumber')?.value ||
                    ('SIDEBAR.QUOTES' | translate)
                  "
                  [linkUrl]="['/quotes', form.get('quoteNumber')?.value]"
                >
                </app-link-field>
              </div>
              <div class="input-group-text"><i class="bi bi-building"></i></div>
            </div>
          </div>

          <div class="col-12 col-md-4">
            <app-date-field
              formControlName="date"
              [label]="'TRIPS.TRIP_DATE' | translate"
            ></app-date-field>
          </div>

          <div class="col-12 col-md-5">
            <div class="input-group">
              <div class="form-floating flex-fill">
                <select
                  formControlName="status"
                  class="form-select"
                  [class.is-invalid]="isInvalid('status')"
                  [class.is-valid]="isValid('status')"
                >
                  <option
                    *ngFor="let s of tripStatusOptions"
                    [value]="s.value"
                  >
                    {{ s.label }}
                  </option>
                </select>
                <label for="status">{{ 'COMMON.STATUS' | translate }}</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-info-circle"></i>
              </div>
            </div>
          </div>

          <div class="col-6 col-md-3">
            <div class="input-group">
              <div class="form-floating flex-fill">
                <input
                  formControlName="discount"
                  type="number"
                  min="0"
                  max="100"
                  [placeholder]="'TRANSACTIONS.DISCOUNT' | translate"
                  class="form-control"
                  [class.is-invalid]="isInvalid('discount')"
                  [class.is-valid]="isValid('discount')"
                />
                <label for="discount">{{ 'TRANSACTIONS.DISCOUNT' | translate }}</label>
              </div>
              <div class="input-group-text"><i class="bi bi-percent"></i></div>
            </div>
          </div>

          <div class="col-6">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="price"
                  type="number"
                  min="0"
                  [placeholder]="'COMMON.PRICE' | translate"
                  class="form-control"
                  [class.is-invalid]="isInvalid('price')"
                  [class.is-valid]="isValid('price')"
                />
                <label for="price">{{ 'COMMON.PRICE' | translate }}</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-cash-coin"></i>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="totalPriceFormatted"
                  type="text"
                  [placeholder]="'COMMON.TOTAL_PRICE_LABEL' | translate"
                  class="form-control"
                  [class.is-invalid]="isInvalid('totalPriceFormatted')"
                  [class.is-valid]="isValid('totalPriceFormatted')"
                />
                <label for="totalPrice">{{ 'COMMON.TOTAL_PRICE_LABEL' | translate }}</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-cash-coin"></i>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Dados da viagem: veículo, motorista e cálculo por km/diária -->
      <section class="trip-section mt-2">
        <h5>{{ 'TRIPS.TRIP_DATA' | translate }}</h5>
        <div class="row g-1 mb-1">
          <div class="col-12 col-md-6">
            <div class="input-group">
              <div class="form-floating flex-fill select-floating">
                <select formControlName="vehicleId" class="form-select">
                  <option [ngValue]="null">{{ 'TRIPS.NO_VEHICLE' | translate }}</option>
                  <option *ngFor="let v of vehicles" [ngValue]="v.id">
                    {{ v.plate }} - {{ v.brand }} {{ v.model }} ({{
                      v.status
                    }})
                  </option>
                </select>
                <label>{{ 'VEHICLES.SINGULAR' | translate }}</label>
              </div>
              <div class="input-group-text"><i class="bi bi-bus-front"></i></div>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="input-group">
              <div class="form-floating flex-fill select-floating">
                <select formControlName="driverId" class="form-select">
                  <option [ngValue]="null">{{ 'TRIPS.NO_DRIVER' | translate }}</option>
                  <option *ngFor="let d of drivers" [ngValue]="d.id">
                    {{ d.name }} ({{ d.status }})
                  </option>
                </select>
                <label>{{ 'SIDEBAR.DRIVER' | translate }}</label>
              </div>
              <div class="input-group-text"><i class="bi bi-person-vcard"></i></div>
            </div>
          </div>
          <div class="col-12">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="route"
                  type="text"
                  [placeholder]="'TRIPS.ROUTE' | translate"
                  class="form-control"
                />
                <label>{{ 'TRIPS.ROUTE' | translate }}</label>
              </div>
              <div class="input-group-text"><i class="bi bi-signpost-split"></i></div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="distanceKm"
                  type="number"
                  min="0"
                  [placeholder]="'TRIPS.DISTANCE_KM' | translate"
                  class="form-control"
                />
                <label>{{ 'TRIPS.DISTANCE_KM' | translate }}</label>
              </div>
            </div>
          </div>
          <div class="col-6 col-md-3">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="dailyCount"
                  type="number"
                  min="0"
                  [placeholder]="'TRIPS.DAILY_COUNT' | translate"
                  class="form-control"
                />
                <label>{{ 'TRIPS.DAILY_COUNT' | translate }}</label>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <div class="input-group">
              <div class="form-floating flex-fill">
                <input
                  formControlName="transportLicenseNumber"
                  type="text"
                  [placeholder]="'TRIPS.LICENSE_NUMBER' | translate"
                  class="form-control"
                  id="transportLicenseNumber"
                />
                <label for="transportLicenseNumber">{{ 'TRIPS.LICENSE_NUMBER' | translate }}</label>
              </div>
              <div class="input-group-text"><i class="bi bi-patch-check"></i></div>
            </div>
          </div>
          <div class="col-12 col-md-6">
            <app-date-field
              formControlName="transportLicenseExpiryDate"
              [label]="'TRIPS.LICENSE_EXPIRY' | translate"
            ></app-date-field>
          </div>
          <div class="col-12" *ngIf="form.get('vehicleId')?.value">
            <small class="text-muted">
              {{ 'TRIPS.PRICE_AUTO_CALC_HINT' | translate }}
            </small>
          </div>
        </div>
      </section>

      <section>
        @if (canDisplayTransactionForm) {
          <app-transaction-form
            [isEdit]="isEdit"
            [formGroup]="transactionFormGroup"
            [compact]="true"
            [data]="data?.transaction"
            [parentData]="data"
          ></app-transaction-form>
        } @else {
          <div [ngClass]="'callout callout-success mb-2'">
            <i class="fas fa-check"></i>
            {{ 'TRANSACTIONS.ADVANCE_PAYMENT_HINT' | translate }}
          </div>
        }
      </section>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-form-cancel me-2" (click)="cancel()"><i class="bi bi-x-lg"></i>{{ 'COMMON.CANCEL' | translate }}</button>
      @if (isEdit) {
        <button (click)="remove()" type="button" class="btn btn-form-remove me-2"><i class="bi bi-trash"></i>{{ 'COMMON.REMOVE' | translate }}</button>
      }
      <button
        [appClick]="submit.bind(this)"
        type="submit"
        class="btn btn-form-save"
      >
        <i class="bi bi-check-lg"></i>{{ (isEdit ? 'COMMON.SAVE' : 'COMMON.ADD') | translate }}
      </button>
    </div>
  </form>
</div>
