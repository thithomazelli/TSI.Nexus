<div class="trip-leg-list">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0">Itinerário</h5>
    <button type="button" class="btn btn-success btn-sm" (click)="openModal()">
      <i class="bi bi-plus-lg"></i> Novo trecho
    </button>
  </div>

  <table class="table table-sm">
    <thead>
      <tr>
        <th>#</th>
        <th>Origem</th>
        <th>Destino</th>
        <th>Saída</th>
        <th>{{ 'VEHICLES.KM' | translate }}</th>
        <th style="width: 60px"></th>
      </tr>
    </thead>
    <tbody>
      @for (leg of tripLegs; track leg.id) {
        <tr>
          <td>{{ leg.sequenceNumber }}</td>
          <td>{{ leg.origin }}</td>
          <td>{{ leg.destination }}</td>
          <td>{{ leg.departureDate | date: 'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ leg.distanceKm }}</td>
          <td>
            <button
              type="button"
              class="btn btn-link btn-sm p-0 text-danger"
              title="Remover"
              (click)="removeTripLeg(leg)"
            >
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center text-muted small py-3">
            Nenhum trecho cadastrado
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
