<div class="modal-header">
  <h5 class="modal-title">{{ isEdit ? 'Editar Passageiro' : 'Novo Passageiro' }}</h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row g-2">
      <div class="col-12">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="name"
              type="text"
              placeholder="Nome"
              class="form-control"
              id="passengerModalName"
            />
            <label for="passengerModalName">Nome</label>
          </div>
          <div class="input-group-text"><i class="bi bi-person"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="documentNumber"
              type="text"
              placeholder="Documento"
              class="form-control"
              id="passengerModalDocumentNumber"
            />
            <label for="passengerModalDocumentNumber">Documento</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="seat"
              type="text"
              placeholder="Assento"
              class="form-control"
              id="passengerModalSeat"
            />
            <label for="passengerModalSeat">Assento</label>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="phone"
              type="text"
              placeholder="Telefone"
              class="form-control"
              id="passengerModalPhone"
            />
            <label for="passengerModalPhone">Telefone</label>
          </div>
          <div class="input-group-text"><i class="bi bi-telephone"></i></div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary btn-sm me-2" (click)="close()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-success btn-sm" [disabled]="saving">
        {{ isEdit ? 'Salvar' : 'Adicionar' }}
      </button>
    </div>
  </form>
</div>
