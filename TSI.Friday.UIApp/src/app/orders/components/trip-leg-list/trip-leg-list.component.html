<div class="trip-leg-list">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0">Itinerário</h5>
    <button type="button" class="btn btn-success btn-sm" (click)="toggleForm()">
      <i class="bi bi-plus-lg"></i> Novo trecho
    </button>
  </div>

  @if (showForm) {
    <form [formGroup]="form" (ngSubmit)="addTripLeg()" class="border rounded p-3 mb-3">
      <div class="row g-2">
        <div class="col-12 col-md-3">
          <label class="form-label">Origem</label>
          <input formControlName="origin" type="text" class="form-control" />
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label">Destino</label>
          <input formControlName="destination" type="text" class="form-control" />
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label">Data/hora de saída</label>
          <input formControlName="departureDate" type="datetime-local" class="form-control" />
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label">Distância (km)</label>
          <input formControlName="distanceKm" type="number" min="0" class="form-control" />
        </div>
        <div class="col-12">
          <label class="form-label">Observações</label>
          <input formControlName="notes" type="text" class="form-control" />
        </div>
      </div>
      <div class="d-flex justify-content-end mt-2">
        <button type="button" class="btn btn-secondary btn-sm me-2" (click)="toggleForm()">
          Cancelar
        </button>
        <button type="submit" class="btn btn-success btn-sm">Salvar</button>
      </div>
    </form>
  }

  <table class="table table-sm">
    <thead>
      <tr>
        <th>#</th>
        <th>Origem</th>
        <th>Destino</th>
        <th>Saída</th>
        <th>Km</th>
        <th style="width: 60px"></th>
      </tr>
    </thead>
    <tbody>
      @for (leg of tripLegs; track leg.id) {
        <tr>
          <td>{{ leg.sequenceNumber }}</td>
          <td>{{ leg.origin }}</td>
          <td>{{ leg.destination }}</td>
          <td>{{ leg.departureDate | date: 'dd/MM/yyyy HH:mm' }}</td>
          <td>{{ leg.distanceKm }}</td>
          <td>
            <button
              type="button"
              class="btn btn-link btn-sm p-0 text-danger"
              title="Remover"
              (click)="removeTripLeg(leg)"
            >
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center text-muted small py-3">
            Nenhum trecho cadastrado
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
