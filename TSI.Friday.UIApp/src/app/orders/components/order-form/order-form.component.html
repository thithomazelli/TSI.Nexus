<div class="order-form-wrapper custom-modal">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="input-group mb-1" *ngIf="isEdit">
      <div class="form-floating">
        <input
          formControlName="orderNumber"
          type="text"
          placeholder="Order Number"
          class="form-control"
          [class.is-invalid]="isInvalid('orderNumber')"
          [class.is-valid]="isValid('orderNumber')"
        />
        <label for="orderNumber">Order Number</label>
      </div>
      <div class="input-group-text"><i class="bi bi-hash"></i></div>
    </div>

    <div class="input-group mb-1">
      <div class="form-floating">
        <input
          type="text"
          formControlName="clientName"
          class="form-control"
          [matAutocomplete]="auto"
          #firstInput
          [class.is-invalid]="isInvalid('clientName')"
          placeholder="Cliente"
          (blur)="onClientBlur()"
        />
        <label for="clientName">Cliente</label>
        <mat-autocomplete #auto="matAutocomplete">
          <mat-option
            *ngFor="let client of filteredClients$ | async"
            [value]="client.name"
          >
            {{ client.name }}
          </mat-option>
        </mat-autocomplete>
      </div>
      <div class="input-group-text"><i class="bi bi-person"></i></div>
    </div>

    <div class="row mb-1">
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <select
              formControlName="status"
              class="form-select"
              [class.is-invalid]="isInvalid('status')"
              [class.is-valid]="isValid('status')"
            >
              <option *ngFor="let s of orderStatusOptions" [value]="s.value">
                {{ s.label }}
              </option>
            </select>
            <label for="status">Status</label>
          </div>
          <div class="input-group-text"><i class="bi bi-info-circle"></i></div>
        </div>
      </div>
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="discount"
              type="number"
              min="0"
              max="100"
              placeholder="Discount"
              class="form-control"
              [class.is-invalid]="isInvalid('discount')"
              [class.is-valid]="isValid('discount')"
            />
            <label for="discount">Discount</label>
          </div>
          <div class="input-group-text"><i class="bi bi-percent"></i></div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating">
            <input
              formControlName="priceFormatted"
              type="text"
              placeholder="Price"
              class="form-control"
              [class.is-invalid]="isInvalid('priceFormatted')"
              [class.is-valid]="isValid('priceFormatted')"
            />
            <label for="price">Price</label>
          </div>
          <div class="input-group-text">
            <i class="bi bi-cash-coin"></i>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating">
            <input
              formControlName="totalPriceFormatted"
              type="text"
              placeholder="Total Price"
              class="form-control"
              [class.is-invalid]="isInvalid('totalPriceFormatted')"
              [class.is-valid]="isValid('totalPriceFormatted')"
            />
            <label for="totalPrice">Total Price</label>
          </div>
          <div class="input-group-text">
            <i class="bi bi-cash-coin"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- <div class="d-flex justify-content-end">
      <button
        type="button"
        class="btn btn-primary mt-3"
        (click)="openOrderProductsModal()"
      >
        Adicionar Produto
      </button>
    </div> -->

    <!-- Tabela de produtos do pedido -->
    <hr />
    <div class="order-products-table mt-2">
      <div
        class="order-products-header d-flex justify-content-between align-items-center mb-2"
      >
        <h5>Produtos</h5>
        <a class="address-link" (click)="openOrderProductsModal()">
          Adicionar
        </a>
      </div>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">SKU</th>
            <th scope="col">Nome</th>
            <th scope="col">Preço</th>
            <th scope="col">Qtd</th>
            <th scope="col" style="width: 40px"></th>
          </tr>
        </thead>
        <tbody class="table-group-divider">
          <tr *ngFor="let item of data?.orderProducts; let i = index">
            <td>{{ item.productSku }}</td>
            <td>{{ item.productName }}</td>
            <td>R$ {{ item.price | number: "1.2-2" }}</td>
            <td>{{ item.quantity }}</td>
            <td>
              <button
                type="button"
                class="btn btn-link p-0 text-danger"
                title="Remover"
                (click)="removeProduct(i)"
                style="font-size: 1.1rem"
              >
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="!data?.orderProducts || data?.orderProducts?.length === 0">
            <td colspan="5" class="text-center text-muted small py-3">
              Nenhum produto adicionado
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary me-2" (click)="doCancel()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-success" [disabled]="form.invalid">
        Salvar
      </button>
    </div>
  </form>
</div>
