<div class="order-form-wrapper custom-modal">
  <form [formGroup]="form" (ngSubmit)="submit()">
    @if (isEdit) {
      <div class="input-group mb-1">
        <div class="form-floating">
          <input
            formControlName="orderNumber"
            type="text"
            placeholder="Order Number"
            class="form-control"
            [class.is-invalid]="isInvalid('orderNumber')"
            [class.is-valid]="isValid('orderNumber')"
          />
          <label for="orderNumber">Order Number</label>
        </div>
        <div class="input-group-text"><i class="bi bi-hash"></i></div>
      </div>
    }

    <div class="input-group mb-1">
      <div class="form-floating">
        <input
          type="text"
          formControlName="clientName"
          class="form-control"
          [matAutocomplete]="auto"
          #firstInput
          [class.is-invalid]="isInvalid('clientName')"
          placeholder="Cliente"
          (blur)="onClientBlur()"
        />
        <label for="clientName">Cliente</label>
        <mat-autocomplete #auto="matAutocomplete">
          <mat-option
            *ngFor="let client of filteredClients$ | async"
            [value]="client.name"
          >
            {{ client.name }}
          </mat-option>
        </mat-autocomplete>
      </div>
      <div class="input-group-text"><i class="bi bi-person"></i></div>
    </div>

    <div class="input-group mb-1">
      <div class="form-floating">
        <input
          formControlName="description"
          type="text"
          placeholder="Description"
          class="form-control"
          [class.is-invalid]="isInvalid('description')"
          [class.is-valid]="isValid('description')"
        />
        <label for="description">Description</label>
      </div>
      <div class="input-group-text"><i class="bi bi-card-text"></i></div>
    </div>

    <div class="row mb-1">
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <select
              formControlName="status"
              class="form-select"
              [class.is-invalid]="isInvalid('status')"
              [class.is-valid]="isValid('status')"
            >
              <option *ngFor="let s of orderStatusOptions" [value]="s.value">
                {{ s.label }}
              </option>
            </select>
            <label for="status">Status</label>
          </div>
          <div class="input-group-text"><i class="bi bi-info-circle"></i></div>
        </div>
      </div>
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="discount"
              type="number"
              min="0"
              max="100"
              placeholder="Discount"
              class="form-control"
              [class.is-invalid]="isInvalid('discount')"
              [class.is-valid]="isValid('discount')"
            />
            <label for="discount">Discount</label>
          </div>
          <div class="input-group-text"><i class="bi bi-percent"></i></div>
        </div>
      </div>
    </div>

    <div class="row">
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating">
            <input
              formControlName="priceFormatted"
              type="text"
              placeholder="Price"
              class="form-control"
              [class.is-invalid]="isInvalid('priceFormatted')"
              [class.is-valid]="isValid('priceFormatted')"
            />
            <label for="price">Price</label>
          </div>
          <div class="input-group-text">
            <i class="bi bi-cash-coin"></i>
          </div>
        </div>
      </div>
      <div class="col-6">
        <div class="input-group">
          <div class="form-floating">
            <input
              formControlName="totalPriceFormatted"
              type="text"
              placeholder="Total Price"
              class="form-control"
              [class.is-invalid]="isInvalid('totalPriceFormatted')"
              [class.is-valid]="isValid('totalPriceFormatted')"
            />
            <label for="totalPrice">Total Price</label>
          </div>
          <div class="input-group-text">
            <i class="bi bi-cash-coin"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabela de produtos do pedido -->
    <div class="order-products-table my-3" hidden>
      <table class="table table-bordered table-sm align-middle">
        <thead class="table-light">
          <tr>
            <th>SKU</th>
            <th>Nome</th>
            <th>Preço</th>
            <th>Quantidade</th>
            <th style="width: 40px"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of data?.orderProducts; let i = index">
            <td>{{ item.productSku }}</td>
            <td>{{ item.productName }}</td>
            <td>R$ {{ item.price | number: "1.2-2" }}</td>
            <td>{{ item.quantity }}</td>
            <td>
              <button
                type="button"
                class="btn btn-sm btn-danger"
                (click)="removeProduct(i)"
              >
                <i class="bi bi-trash"></i>
              </button>
            </td>
          </tr>
          <tr *ngIf="!data?.orderProducts || data?.orderProducts?.length === 0">
            <td colspan="5" class="text-center text-muted">
              Nenhum produto adicionado
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary me-2" (click)="doCancel()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-success" [disabled]="form.invalid">
        Salvar
      </button>
    </div>
  </form>
</div>
