<div class="modal-header">
  <h5 class="modal-title">Novo Trecho</h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row g-2 mb-2">
      <div class="col-12">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="origin"
              type="text"
              placeholder="Origem"
              class="form-control"
              id="origin"
            />
            <label for="origin">Origem</label>
          </div>
          <div class="input-group-text"><i class="bi bi-geo-alt"></i></div>
        </div>
      </div>
    </div>

    <div formArrayName="stops">
      @for (stop of stops.controls; track stop; let i = $index) {
        <div [formGroupName]="i" class="border rounded p-2 mb-2">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <b class="small">Destino {{ i + 1 }}</b>
            <button
              type="button"
              class="btn btn-link btn-sm p-0 text-danger"
              title="Remover destino"
              [disabled]="stops.length === 1"
              (click)="removeStop(i)"
            >
              <i class="bi bi-trash"></i>
            </button>
          </div>
          <div class="row g-2">
            <div class="col-12 col-md-6">
              <div class="input-group">
                <div class="form-floating flex-fill">
                  <input
                    formControlName="destination"
                    type="text"
                    placeholder="Destino"
                    class="form-control"
                    [id]="'destination-' + i"
                  />
                  <label [for]="'destination-' + i">Destino</label>
                </div>
                <div class="input-group-text"><i class="bi bi-geo-alt-fill"></i></div>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <app-date-field
                formControlName="dateOnly"
                [label]="'Data de saída'"
              ></app-date-field>
            </div>
            <div class="col-12 col-md-6">
              <div class="input-group">
                <div class="form-floating flex-fill">
                  <input
                    formControlName="time"
                    type="time"
                    placeholder="Hora de saída"
                    class="form-control"
                    [id]="'time-' + i"
                  />
                  <label [for]="'time-' + i">Hora de saída</label>
                </div>
                <div class="input-group-text"><i class="bi bi-clock"></i></div>
              </div>
            </div>
            <div class="col-12 col-md-6">
              <div class="input-group">
                <div class="form-floating flex-fill">
                  <input
                    formControlName="distanceKm"
                    type="number"
                    min="0"
                    placeholder="Distância deste trecho (km)"
                    class="form-control"
                    [id]="'distanceKm-' + i"
                  />
                  <label [for]="'distanceKm-' + i">Distância deste trecho (km)</label>
                </div>
                <div class="input-group-text"><i class="bi bi-signpost-split"></i></div>
              </div>
            </div>
            <div class="col-12">
              <div class="input-group">
                <div class="form-floating flex-fill">
                  <input
                    formControlName="notes"
                    type="text"
                    placeholder="Observações"
                    class="form-control"
                    [id]="'notes-' + i"
                  />
                  <label [for]="'notes-' + i">Observações</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
    </div>

    <button type="button" class="btn btn-outline-primary btn-sm mb-3" (click)="addStop()">
      <i class="bi bi-plus-lg"></i> Adicionar destino
    </button>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary btn-sm me-2" (click)="close()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-success btn-sm" [disabled]="saving">
        Salvar
      </button>
    </div>
  </form>
</div>
