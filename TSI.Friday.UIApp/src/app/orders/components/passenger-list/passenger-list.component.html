<div class="passenger-list">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <h5 class="mb-0">Passageiros</h5>
    <div class="d-flex gap-2">
      <button type="button" class="btn btn-success btn-sm" (click)="openModal()">
        <i class="bi bi-plus-lg"></i> Novo passageiro
      </button>
    </div>
  </div>
  <p class="text-muted small mb-2">
    Para importar uma lista de passageiros a partir de um arquivo, use a aba
    <b>Importar Passageiros</b>.
  </p>

  <table class="table table-sm">
    <thead>
      <tr>
        <th>Nome</th>
        <th>Documento</th>
        <th>Assento</th>
        <th>Telefone</th>
        <th style="width: 80px"></th>
      </tr>
    </thead>
    <tbody>
      @for (p of passengers; track p.id) {
        <tr>
          <td>{{ p.name }}</td>
          <td>{{ p.documentNumber }}</td>
          <td>{{ p.seat }}</td>
          <td>{{ p.phone }}</td>
          <td>
            <button
              type="button"
              class="btn btn-link btn-sm p-0 me-2"
              title="Editar"
              (click)="openModal(p)"
            >
              <i class="bi bi-pencil"></i>
            </button>
            <button
              type="button"
              class="btn btn-link btn-sm p-0 text-danger"
              title="Remover"
              (click)="removePassenger(p)"
            >
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="5" class="text-center text-muted small py-3">
            Nenhum passageiro cadastrado
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
