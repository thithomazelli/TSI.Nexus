<app-header
  [title]="isEdit ? 'Editar Pedido' : 'Adicionar Pedido'"
  [navigationMenus]="[
    { label: 'Home', link: '/home' },
    { label: 'Pedidos', link: '/orders' },
    { label: isEdit ? 'Editar Pedido' : 'Adicionar Pedido', link: '' },
  ]"
></app-header>
<section class="content">
  <div class="container-fluid">
    <div class="row">
      <!-- Coluna de informações do pedido -->
      <div class="col-md-3">
        <div class="card card-secondary card-outline mb-2">
          <div class="card-body box-profile">
            <div class="text-center">
              <i class="bi bi-receipt" style="font-size: 4rem"></i>
              <div class="box-profile">
                <div class="text-center">
                  <ul class="list-group list-group-unbordered mb-3">
                    <li class="list-group-item">
                      <b>Número do Pedido: </b>
                      <span class="float-right">{{ data?.orderNumber }}</span>
                    </li>
                    <li class="list-group-item">
                      <b>Cliente: </b>
                      <span class="float-right">{{
                        data?.businessPartnerName
                      }}</span>
                    </li>
                    <li class="list-group-item">
                      <b>Status: </b>
                      <span class="float-right">{{ getStatusLabel() }}</span>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
          @if (isEdit) {
            <div class="card-footer text-center d-flex flex-column gap-2">
              <button
                type="button"
                class="btn btn-outline-primary btn-sm w-100"
                [disabled]="emittingSalesOrder"
                (click)="emitSalesOrder()"
              >
                <i class="bi bi-file-earmark-pdf"></i> Emitir Pedido de Venda
              </button>
            </div>
          }
        </div>
      </div>
      <!-- /.col -->
      <div class="col-md-9">
        <div class="card card-secondary card-outline">
          <div class="card-body">
            <ul class="nav nav-tabs mb-3">
              <li class="nav-item">
                <a
                  class="nav-link"
                  [class.active]="activeTab === 'details'"
                  (click)="activeTab = 'details'"
                  >Detalhes</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  [class.active]="activeTab === 'products'"
                  (click)="activeTab = 'products'"
                  >Produtos</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  [class.active]="activeTab === 'payments'"
                  (click)="activeTab = 'payments'"
                  >Pagamentos</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  [class.active]="activeTab === 'attachments'"
                  (click)="activeTab = 'attachments'"
                  >Anexos</a
                >
              </li>
            </ul>
            <div *ngIf="activeTab === 'details'">
              <app-order-form
                [isEdit]="isEdit"
                [data]="data"
                [compact]="false"
              ></app-order-form>
            </div>

            <div *ngIf="activeTab === 'products'">
              <app-order-products
                [compact]="true"
                [isFullList]="false"
                [parentId]="data?.id"
              ></app-order-products>
            </div>
            <div *ngIf="activeTab === 'payments'">
              <app-payments
                [compact]="true"
                [canAdd]="true"
                [entity]="'Order'"
                [parentData]="data"
              ></app-payments>
            </div>
            <div *ngIf="activeTab === 'attachments'">
              <app-attachments
                [entity]="'order'"
                [entityId]="data!.id!"
                [orderNumber]="data!.orderNumber!"
              ></app-attachments>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
