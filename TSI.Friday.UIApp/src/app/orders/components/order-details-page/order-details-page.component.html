<app-header
  [title]="isEdit ? 'Editar Pedido' : 'Adicionar Pedido'"
  [navigationMenus]="[
    { label: 'Home', link: '/home' },
    { label: 'Pedidos', link: '/orders' },
    { label: isEdit ? 'Editar Pedido' : 'Adicionar Pedido', link: '' },
  ]"
></app-header>
<section class="content">
  <div class="container-fluid">
    <div class="row">
      <!-- Coluna de informações do pedido -->
      <div class="col-md-3">
        <div class="card card-secondary card-outline">
          <div class="card-body box-profile">
            <div class="text-center">
              <i class="bi bi-receipt" style="font-size: 4rem"></i>
              <div class="box-profile">
                <div class="text-center">
                  <ul class="list-group list-group-unbordered mb-3">
                    <li class="list-group-item">
                      <b>Número do Pedido</b>
                      <span class="float-right">{{ data?.orderNumber }}</span>
                    </li>
                    <li class="list-group-item">
                      <b>Status</b>
                      <span class="float-right">{{ data?.status }}</span>
                    </li>
                    <li class="list-group-item">
                      <b>Cliente</b>
                      <span class="float-right">{{ data?.clientName }}</span>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- /.col -->
      <div class="col-md-9">
        <div class="card card-secondary card-outline">
          <div class="card-body">
            <ul class="nav nav-tabs mb-3">
              <li class="nav-item">
                <a
                  class="nav-link"
                  [class.active]="activeTab === 'details'"
                  (click)="activeTab = 'details'"
                  >Detalhes</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  [class.active]="activeTab === 'products'"
                  (click)="activeTab = 'products'"
                  >Produtos</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  [class.active]="activeTab === 'payments'"
                  (click)="activeTab = 'payments'"
                  >Pagamentos</a
                >
              </li>
            </ul>
            <div *ngIf="activeTab === 'details'">
              <!-- <app-order-form
                [isEdit]="isEdit"
                [data]="data"
                (save)="onSave($event)"
                (cancel)="onCancel()"
                [compact]="false"
                [errors]="errorMessages"
              ></app-order-form> -->

              <!-- Sessão 1: Order Form -->
              <section class="order-section">
                <h6>Dados do Pedido</h6>
                <app-order-form
                  [isEdit]="isEdit"
                  [data]="data"
                  (save)="onSave($event)"
                  (cancel)="onCancel()"
                  [compact]="false"
                  [errors]="errorMessages"
                ></app-order-form>
              </section>

              <hr />

              <!-- Sessão 3: Payment Form -->
              <section class="order-section">
                <h6>Pagamento</h6>
                <!-- <app-payment-form [isEdit]="isEdit"></app-payment-form> -->
              </section>
            </div>

            <div *ngIf="activeTab === 'products'">
              <app-order-products
                [parentOrderId]="data?.id"
                (orderProductsUpdated)="onOrderProductsUpdated()"
              ></app-order-products>
            </div>
            <div *ngIf="activeTab === 'payments'">
              <app-payment-installments
                [entity]="'Order'"
                [data]="data"
              ></app-payment-installments>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
