<aside>
  <!--begin::Sidebar Brand-->
  <div class="sidebar-brand">
    <!--begin::Brand Link-->
    <a
      routerLink="/home"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="brand-link"
    >
      <!--begin::Brand Image-->
      <img
        src="./assets/img/logo.png"
        alt="AdminLTE Logo"
        class="brand-image opacity-75 shadow"
      />
      <!--end::Brand Image-->
      <!--begin::Brand Text-->
      <span class="brand-text fw-light">Bianchi Caçambas</span>
      <!--end::Brand Text-->
    </a>
    <!--end::Brand Link-->
  </div>
  <!--end::Sidebar Brand-->
  <!--begin::Sidebar Wrapper-->
  <div class="sidebar-wrapper">
    <nav class="mt-2">
      <!--begin::Sidebar Menu-->
      <ul
        class="nav sidebar-menu flex-column"
        data-lte-toggle="treeview"
        role="navigation"
        aria-label="Main navigation"
        data-accordion="false"
        id="navigation"
      >
        <li class="nav-item">
          <a
            routerLink="/home"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            <i class="nav-icon bi bi-house"></i>
            <p>Home</p>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/clients"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            <i class="nav-icon bi bi-people"></i>
            <p>Clientes</p>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/suppliers"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            <i class="nav-icon bi bi-truck"></i>
            <p>Fornecedores</p>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/products"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            <i class="nav-icon bi bi-box-seam"></i>
            <p>Produtos</p>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/orders"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            <i class="nav-icon bi bi-receipt-cutoff"></i>
            <p>Pedidos de Vendas</p>
          </a>
        </li>

        <li class="nav-item">
          <a
            routerLink="/order-products"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link"
          >
            <i class="nav-icon bi bi-receipt-cutoff"></i>
            <p>Relatório Locações</p>
          </a>
        </li>

        <ng-container *ngIf="isAdmin">
          <li class="nav-header">Financeiro</li>
          <li class="nav-item">
            <a
              routerLink="/transactions"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <i class="nav-icon bi bi-cash-stack"></i>
              <p>Transações</p>
            </a>
          </li>
          <li class="nav-item">
            <a
              routerLink="/payments"
              [queryParams]="{ type: 'Incoming' }"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <i class="nav-icon bi bi-file-earmark-text"></i>
              <p>Pagamentos</p>
            </a>
          </li>
          <li class="nav-item">
            <a
              routerLink="/payments"
              [queryParams]="{ type: 'Outgoing' }"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <i class="nav-icon bi bi-bag-dash"></i>
              <p>Despesas</p>
            </a>
          </li>
          <li class="nav-item">
            <a
              routerLink="/reports"
              [queryParams]="{ type: 'Outgoing' }"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <i class="nav-icon bi bi-bar-chart"></i>
              <p>Relatórios</p>
            </a>
          </li>
          <li class="nav-header">Admin</li>
          <li class="nav-item">
            <a
              routerLink="/users"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              class="nav-link"
            >
              <i class="nav-icon bi bi-person-badge"></i>
              <p>Usuários</p>
            </a>
          </li>
        </ng-container>

        <!-- more items omitted for brevity -->
      </ul>

      <!--end::Sidebar Menu-->
    </nav>
  </div>
  <!--end::Sidebar Wrapper-->
</aside>
