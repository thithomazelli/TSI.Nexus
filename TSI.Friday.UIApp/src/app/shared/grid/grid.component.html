<div class="d-flex justify-content-between mb-3">
  <div>
    <button
      *ngIf="canAdd"
      class="btn btn-success me-2"
      (click)="openAddModal()"
    >
      <i class="bi bi-plus-lg"></i>
      Adicionar
    </button>
    <button class="btn btn-secondary me-2" (click)="refresh()">
      <i class="bi bi-arrow-clockwise"></i>
      Atualizar
    </button>
    <button
      *ngIf="filtersTemplate"
      class="btn btn-outline-primary"
      [ngClass]="showFilters ? 'active' : ''"
      (click)="toggleFilters()"
    >
      <i class="bi bi-funnel"></i> Filtros
    </button>
  </div>
  <div style="width: 300px">
    <input
      type="text"
      class="form-control"
      placeholder="Buscar {{ className | lowercase }}..."
      (input)="onFilterTextBoxChanged($event)"
    />
  </div>
</div>
<div *ngIf="showFilters && filtersTemplate">
  <ng-container *ngTemplateOutlet="filtersTemplate"></ng-container>
</div>

<div class="grid-host" [ngClass]="{ 'compact-view': compactView }">
  <ag-grid-angular
    class="ag-theme-alpine grid-full"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [pagination]="true"
    [paginationPageSize]="10"
    [paginationPageSizeSelector]="[10, 20, 50, 100]"
    [animateRows]="true"
    [overlayNoRowsTemplate]="noRowsOverlayTemplate"
    [localeText]="localeText"
    [quickFilterText]="quickFilter"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)"
  >
  </ag-grid-angular>
</div>
