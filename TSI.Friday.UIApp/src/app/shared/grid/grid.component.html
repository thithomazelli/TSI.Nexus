<div class="d-flex justify-content-between mb-3">
  <div>
    <button class="btn btn-success me-2" (click)="openAddModal()">
      <i class="bi bi-plus-lg"></i>
      Adicionar {{ className }}
    </button>
    <button class="btn btn-secondary" (click)="refresh()">
      <i class="bi bi-arrow-clockwise"></i>
      Atualizar
    </button>
  </div>
  <div style="width: 300px">
    <input
      type="text"
      class="form-control"
      placeholder="Search {{ className | lowercase }}..."
      (input)="onFilterTextBoxChanged($event)"
    />
  </div>
</div>

<!-- Responsive grid wrapper: use calc(95vh - 220px) on desktop but adapt via CSS media queries -->
<div class="grid-host" [ngClass]="{ 'compact-view': compactView }">
  <ag-grid-angular
    class="ag-theme-alpine grid-full"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [pagination]="true"
    [paginationPageSize]="10"
    [paginationPageSizeSelector]="[10, 20, 50, 100]"
    [animateRows]="true"
    [overlayNoRowsTemplate]="noRowsOverlayTemplate"
    [localeText]="localeText"
    [quickFilterText]="quickFilter"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)"
  >
  </ag-grid-angular>
</div>
