<div class="d-flex flex-wrap justify-content-between mb-3">
  <div class="col-12 col-md-3">
    <div class="input-group">
      <div class="form-floating">
        <input
          type="text"
          class="form-control"
          id="gridSearchInput"
          placeholder="Buscar {{ className | lowercase }}..."
          (input)="onFilterTextBoxChanged($event)"
        />
        <label for="gridSearchInput"
          >Buscar {{ className | lowercase }}...</label
        >
        <span
          class="position-absolute top-50 end-0 translate-middle-y me-3 text-secondary grid-search-icon"
        >
        </span>
      </div>
      <div class="input-group-text"><i class="bi bi-search"></i></div>
    </div>
  </div>
  <div class="d-flex gap-2 align-items-center mt-3 mt-md-0">
    <button
      *ngIf="filtersTemplate"
      class="btn btn-outline-primary"
      [ngClass]="showFilters ? 'active' : ''"
      (click)="toggleFilters()"
    >
      <i class="bi bi-funnel"></i> Filtros
    </button>
    <button class="btn btn-secondary" (click)="refresh()">
      <i class="bi bi-arrow-clockwise"></i>
      Atualizar
    </button>
    <button *ngIf="canAdd" class="btn btn-success" (click)="openAddModal()">
      <i class="bi bi-plus-lg"></i>
      Adicionar
    </button>
  </div>
</div>
<div [@cardCollapse]="showFilters ? 'open' : 'closed'">
  <ng-container *ngIf="filtersTemplate">
    <ng-container *ngTemplateOutlet="filtersTemplate"></ng-container>
  </ng-container>
</div>

<div class="grid-host" [ngClass]="{ 'compact-view': compactView }">
  <ag-grid-angular
    class="ag-theme-alpine grid-full"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [defaultColDef]="defaultColDef"
    [pagination]="true"
    [paginationPageSize]="10"
    [paginationPageSizeSelector]="[10, 20, 50, 100]"
    [animateRows]="true"
    [overlayNoRowsTemplate]="noRowsOverlayTemplate"
    [localeText]="localeText"
    [quickFilterText]="quickFilter"
    (gridReady)="onGridReady($event)"
    (cellClicked)="onCellClicked($event)"
  >
  </ag-grid-angular>
</div>
