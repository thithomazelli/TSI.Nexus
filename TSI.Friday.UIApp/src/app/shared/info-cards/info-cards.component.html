<div
  *ngIf="loading"
  class="d-flex justify-content-center align-items-center"
  style="min-height: 120px"
>
  <div
    class="spinner-border text-primary"
    style="width: 3rem; height: 3rem"
    role="status"
  >
    <span class="visually-hidden">Carregando...</span>
  </div>
</div>
<div *ngIf="!loading">
  <div class="mb-3 d-flex justify-content-end">
    <div class="border rounded p-2 position-relative">
      <span class="position-absolute bg-white px-2 fw-semibold title-area"
        >Período</span
      >
      <div
        class="d-flex flex-row gap-3 justify-content-center align-items-center mt-2"
      >
        <label
          *ngFor="let opt of periodOptions"
          class="form-check-label d-flex align-items-center"
          style="font-weight: 500"
        >
          <input
            type="radio"
            class="form-check-input me-1"
            name="periodRadio"
            [value]="opt.value"
            [checked]="selectedPeriod === opt.value"
            (change)="onPeriodChange($event)"
          />
          {{ opt.label }}
        </label>
      </div>
    </div>
  </div>
  <div class="row mb-3 justify-content-end align-items-center">
    <!-- <div class="mb-2">
    <div class="col-12 col-md-3">
      <label for="periodSelect" class="form-label">Período</label>
      <select
        id="periodSelect"
        class="form-select"
        [value]="selectedPeriod"
        (change)="onPeriodChange($event)"
      >
        <option *ngFor="let opt of periodOptions" [value]="opt.value">
          {{ opt.label }}
        </option>
      </select>
    </div>
  </div> -->
    <div
      class="col-lg-3 col-6"
      *ngFor="let card of cards; let i = index; trackBy: trackByInfoCard"
    >
      <div class="small-box" [ngClass]="getCardColor(card)">
        <div class="inner">
          <h3 [innerHTML]="card.value"></h3>
          <p>{{ card.title }}</p>
        </div>
        <span [innerHTML]="getCardIcon(card)"></span>
        <a
          class="small-box-footer link-underline-opacity-0 link-underline-opacity-50-hover"
          [ngClass]="
            getCardColor(card) === 'text-bg-warning'
              ? 'link-dark '
              : 'link-light'
          "
          (click)="onViewDetails(card); $event.preventDefault()"
          href="javascript:void(0);"
        >
          Saiba mais <i class="bi bi-link-45deg"></i>
        </a>
      </div>
    </div>
  </div>
</div>
