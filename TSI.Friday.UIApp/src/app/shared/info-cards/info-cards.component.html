<div
  *ngIf="loading"
  class="d-flex justify-content-center align-items-center"
  style="min-height: 120px"
>
  <div
    class="spinner-border text-primary"
    style="width: 3rem; height: 3rem"
    role="status"
  >
    <span class="visually-hidden">Carregando...</span>
  </div>
</div>
<div class="row" *ngIf="!loading">
  <div
    class="col-lg-3 col-6"
    *ngFor="let card of cards; let i = index; trackBy: trackByInfoCard"
  >
    <div class="small-box" [ngClass]="getCardColor(card)">
      <div class="inner">
        <h3 [innerHTML]="card.value"></h3>
        <p>{{ card.title }}</p>
      </div>
      <span [innerHTML]="getCardIcon(card)"></span>
      <a
        class="small-box-footer link-underline-opacity-0 link-underline-opacity-50-hover"
        [ngClass]="
          getCardColor(card) === 'text-bg-warning' ? 'link-dark ' : 'link-light'
        "
        (click)="onViewDetails(card); $event.preventDefault()"
        href="javascript:void(0);"
      >
        Saiba mais <i class="bi bi-link-45deg"></i>
      </a>
    </div>
  </div>
</div>
