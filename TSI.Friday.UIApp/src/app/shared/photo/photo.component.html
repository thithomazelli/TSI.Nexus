<div *ngIf="isModal" class="modal-header">
  <h5 class="modal-title">
    {{ isEdit ? "Edit Image" : "Add Image" }}
  </h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="photo-component mb-3" [class.modal-body]="isModal">
  <div
    class="photo-preview d-flex align-items-center justify-content-center photo-clickable"
    role="button"
    tabindex="0"
    (click)="onPhotoClick()"
    (keydown.enter)="onPhotoClick()"
    (keydown.space)="onPhotoClick()"
    aria-label="Clique para alterar foto"
  >
    <!-- live camera when active -->
    <ng-container *ngIf="cameraActive; else stillPreview">
      <div class="photo-wrapper position-relative">
        <video
          #videoEl
          autoplay
          muted
          playsinline
          class="photo-video rounded-circle profile-user-img img-fluid img-circle"
        ></video>

        <div *ngIf="!isModal" class="photo-hover-overlay" aria-hidden="true">
          <span>clique para alterar</span>
        </div>
      </div>
    </ng-container>

    <ng-template #stillPreview>
      <ng-container *ngIf="previewDataUrl; else placeholder">
        <div class="photo-wrapper position-relative">
          <img
            class="profile-user-img img-fluid img-circle"
            [src]="previewDataUrl"
            alt="photo preview"
          />

          <div *ngIf="!isModal" class="photo-hover-overlay" aria-hidden="true">
            <span>clique para alterar</span>
          </div>
        </div>
      </ng-container>

      <ng-template #placeholder>
        <div class="photo-wrapper position-relative">
          <img
            class="profile-user-img img-fluid img-circle"
            src="assets/img/no_image.png"
            alt="User profile picture"
          />

          <div *ngIf="!isModal" class="photo-hover-overlay" aria-hidden="true">
            <span>clique para alterar</span>
          </div>
        </div>
      </ng-template>
    </ng-template>
  </div>

  <div class="box-profile">
    <div class="text-center">
      <h3 class="profile-username text-center">Nina Mcintire</h3>
      <p class="text-muted text-center">Software Engineer</p>
    </div>

    <div
      *ngIf="isModal"
      class="photo-actions mt-2 d-flex gap-2 justify-content-center"
    >
      <input
        #fileInput
        type="file"
        accept="image/*"
        capture="environment"
        class="d-none"
        (change)="onFileSelected($event)"
      />
      <button
        type="button"
        class="btn btn-outline-primary btn-sm"
        (click)="triggerFile()"
      >
        Upload
      </button>

      <button
        type="button"
        class="btn btn-outline-secondary btn-sm"
        *ngIf="!cameraActive"
        (click)="startCamera()"
      >
        Open Camera
      </button>
      <button
        type="button"
        class="btn btn-outline-success btn-sm"
        *ngIf="cameraActive"
        (click)="capturePhoto()"
      >
        Take Photo
      </button>
      <button
        type="button"
        class="btn btn-outline-danger btn-sm"
        *ngIf="cameraActive"
        (click)="stopCamera()"
      >
        Stop Camera
      </button>

      <button
        type="button"
        class="btn btn-outline-danger btn-sm"
        (click)="removePhoto()"
      >
        Remove
      </button>
    </div>

    <canvas #canvasEl class="d-none"></canvas>
  </div>
</div>
