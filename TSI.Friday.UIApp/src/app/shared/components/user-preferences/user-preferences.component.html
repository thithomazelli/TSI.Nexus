<div class="user-preferences" [class.compact]="compact">
  <div *ngIf="!compact" class="fw-bold mb-2">
    {{ 'PREFERENCES.TITLE' | translate }}
  </div>

  <div class="d-flex align-items-center justify-content-between mb-2">
    <label class="mb-0 small text-muted">{{
      'PREFERENCES.THEME_LABEL' | translate
    }}</label>
    <div class="form-check form-switch mb-0">
      <input
        class="form-check-input"
        type="checkbox"
        role="switch"
        [checked]="(themeService.theme$ | async) === 'dark'"
        [disabled]="saving"
        (change)="onThemeToggle()"
      />
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-between gap-2">
    <label class="mb-0 small text-muted">{{
      'PREFERENCES.LANGUAGE_LABEL' | translate
    }}</label>
    <select
      class="form-select form-select-sm w-auto"
      [disabled]="saving"
      [ngModel]="translationService.current"
      (ngModelChange)="onLanguageChange($event)"
    >
      <option value="pt-BR">Português</option>
      <option value="en">English</option>
      <option value="es">Español</option>
    </select>
  </div>
</div>
