<div class="date-field">
  @if (label) {
    <label class="date-field-label">{{ label }}</label>
  }
  <p-datepicker
    [ngModel]="value"
    (ngModelChange)="onModelChange($event)"
    (onBlur)="onTouched()"
    dateFormat="dd/mm/yy"
    [showIcon]="true"
    iconDisplay="input"
    [placeholder]="placeholder"
    [disabled]="isDisabled"
    inputStyleClass="form-control date-field-input"
    styleClass="date-field-picker"
    appendTo="body"
  ></p-datepicker>
</div>
