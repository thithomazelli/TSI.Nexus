<div style="position: relative">
  <span class="modal-title">{{ title }}</span>
  <button class="close" (click)="dialogRef.close()">&times;</button>
</div>
<div>
  {{ message }}
</div>
<div class="modal-footer">
  <button class="btn btn-secondary" (click)="dialogRef.close()">
    Cancelar
  </button>
  <button class="btn btn-success" (click)="confirmDelete(); dialogRef.close()">
    Excluir
  </button>
</div>
