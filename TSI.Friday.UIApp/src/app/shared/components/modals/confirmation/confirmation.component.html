<h2 mat-dialog-title class="bg-danger">{{ title }}</h2>
<mat-dialog-content>
  {{ message }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Cancelar</button>
  <button mat-button color="warn" (click)="confirmDelete(); dialogRef.close()">
    Excluir
  </button>
</mat-dialog-actions>
