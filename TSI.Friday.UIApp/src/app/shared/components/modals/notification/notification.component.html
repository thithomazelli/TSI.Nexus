<h2
  mat-dialog-title
  [ngClass]="{ 'bg-success': isSuccess, 'bg-danger': !isSuccess }"
>
  {{ title }}
</h2>
<mat-dialog-content>
  {{ message }}
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button color="primary" (click)="dialogRef.close()">Ok</button>
</mat-dialog-actions>
