<header>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <a class="nav-brand">
        <img src="logo.jpg" class="me-3" alt="Logo" style="width: 100px" />
      </a>
      <button class="navbar-toggler" type="button">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/play"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >Play</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              routerLink="/products"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: true }"
              >Products</a
            >
          </li>
        </ul>

        <ul *ngIf="!(user$ | async)" class="navbar-nav">
          <li class="nav-item">
            <a
              class="btn btn-secondary mx-2"
              routerLink="/account/register"
              routerLinkActive="active"
              >Create Account</a
            >
          </li>
          <li class="nav-item">
            <a
              class="btn btn-secondary"
              routerLink="/account/login"
              routerLinkActive="active"
              >Login</a
            >
          </li>
        </ul>

        <div *ngIf="user$ | async as user" class="d-flex align-items-center">
          <a class="text-white logged-in">
            Hi
            <span class="h3 text-warning">
              {{ user.firstName | titlecase }}</span
            >
          </a>
          <a class="btn btn-secondary ms-2" (click)="logout()">Logout</a>
        </div>
      </div>
    </div>
  </nav>
</header>
