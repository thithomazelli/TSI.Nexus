<app-header
  title="Dashboard"
  [navigationMenus]="[
    { label: 'Home', link: '/home' },
    { label: 'Dashboard', link: '' },
  ]"
></app-header>

<!--begin::App Content-->
<div class="app-content">
  <!--begin::Container-->
  <div class="container-fluid">
    <app-info-cards></app-info-cards>
    <!--begin::Row-->
    <!--begin::Filtro-->
    <div class="row mb-3 justify-content-end align-items-center">
      <div class="col-auto">
        <button
          class="btn btn-outline-primary"
          [ngClass]="showFilters ? 'active' : ''"
          (click)="toggleFilters()"
        >
          <i class="bi bi-funnel"></i> Filtros
        </button>
      </div>
    </div>
    <div
      [@cardCollapse]="showFilters ? 'open' : 'closed'"
      class="home-filters-animated"
    >
      <div class="row mb-2 justify-content-end" *ngIf="showFilters">
        <div class="col-auto">
          <div
            class="d-flex gap-2 flex-wrap align-items-center justify-content-end"
          >
            <app-date-field
              [(ngModel)]="filterStartDate"
              label="Data início"
              class="date-filter-area"
            ></app-date-field>
            <app-date-field
              [(ngModel)]="filterEndDate"
              label="Data fim"
              class="date-filter-area"
            ></app-date-field>
            <button class="btn btn-secondary" (click)="clearFilters()">
              Limpar
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="row g-2">
      <div class="col-12">
        <app-area-chart-trending
          [startDate]="filterStartDate"
          [endDate]="filterEndDate"
        ></app-area-chart-trending>
      </div>
      <div class="col-6" hidden>
        <app-area-chart
          [startDate]="filterStartDate"
          [endDate]="filterEndDate"
        ></app-area-chart>
      </div>
      <div class="col-md-6">
        <app-pie-chart
          [title]="'Controle de Gastos'"
          [startDate]="filterStartDate"
          [endDate]="filterEndDate"
        ></app-pie-chart>
      </div>
      <div class="col-md-6">
        <app-pie-chart
          [title]="'Saída'"
          [titleLayout]="'text-danger'"
          [iconLayout]="'bi bi-arrow-down-circle-fill text-danger ms-2'"
          [transactionType]="TransactionType.Outgoing"
          [startDate]="filterStartDate"
          [endDate]="filterEndDate"
        ></app-pie-chart>
      </div>
    </div>
    <!-- /.row (main row) -->
  </div>
  <!--end::Container-->
</div>
<!--end::App Content-->
