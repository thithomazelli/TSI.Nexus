<div class="modal-header">
  <h5 class="modal-title">
    {{ (isEdit ? 'COMMON.EDIT_ENTITY' : 'COMMON.ADD_ENTITY') | translate: { entity: ('SIDEBAR.TRANSACOES' | translate) } }}
  </h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <app-transaction-form
    [isModal]="true"
    [isEdit]="isEdit"
    [data]="data"
    [dialogRef]="dialogRef"
    [compact]="false"
  ></app-transaction-form>
</div>
