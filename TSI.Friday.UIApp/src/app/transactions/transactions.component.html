<app-header
  title="Transações"
  [navigationMenus]="[
    { label: 'Home', link: '/home' },
    { label: 'Transações', link: '' },
  ]"
></app-header>

<div class="app-content">
  <app-grid
    [className]="'Transações'"
    [rowData]="filteredRowData"
    [columnDefs]="columnDefs"
    [baseEndPoint]="baseEndPoint"
    [refresh]="refreshTransactions.bind(this)"
    [delete]="deleteOrder.bind(this)"
    (openModal)="onOpenModal($event)"
    [filtersTemplate]="filtersTpl"
    [showFilters]="showFiltersOnInit"
  ></app-grid>

  <ng-template #filtersTpl>
    <div class="row g-2 mb-2">
      <div class="date-filter-area">
        <app-date-field
          [(ngModel)]="filterStartDate"
          (ngModelChange)="applyFilters()"
          label="Início"
        ></app-date-field>
      </div>
      <div class="date-filter-area">
        <app-date-field
          [(ngModel)]="filterEndDate"
          (ngModelChange)="applyFilters()"
          label="Fim"
        ></app-date-field>
      </div>
      <div class="col-auto d-flex align-items-center gap-2">
        <div class="filter-group-box position-relative">
          <span class="filter-group-label">Status</span>
          <div class="d-flex align-items-center pt-2">
            <label class="form-check-label ms-2">
              <input
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="filterStatus.Approved"
                (change)="applyFilters()"
              />
              Pago
            </label>
            <label class="form-check-label ms-2">
              <input
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="filterStatus.Pending"
                (change)="applyFilters()"
              />
              Em Aberto
            </label>
            <label class="form-check-label ms-2">
              <input
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="filterStatus.Delayed"
                (change)="applyFilters()"
              />
              Atrasado
            </label>
          </div>
        </div>
        <div class="filter-group-box position-relative">
          <span class="filter-group-label">Tipo</span>
          <div class="d-flex align-items-center pt-2">
            <label class="form-check-label ms-2">
              <input
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="filterType.Incoming"
                (change)="applyFilters()"
              />
              Entrada
            </label>
            <label class="form-check-label ms-2">
              <input
                type="checkbox"
                class="form-check-input"
                [(ngModel)]="filterType.Outgoing"
                (change)="applyFilters()"
              />
              Saída
            </label>
          </div>
        </div>
        <button class="btn btn-secondary" (click)="clearFilters()">
          Limpar
        </button>
      </div>
    </div>
  </ng-template>
</div>
