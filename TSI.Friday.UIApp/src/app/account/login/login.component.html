<div class="login-split">
  <div class="login-visual">
    <img
      src="assets/img/nexus/login_background.png"
      alt="Nexus"
      class="login-visual-image"
    />
  </div>

  <div class="login-panel">
    <div class="login-panel-inner">
      <p class="login-welcome">{{ 'ACCOUNT.LOGIN.WELCOME' | translate }}</p>

      <div class="login-card">
        <form [formGroup]="form" (ngSubmit)="login()" novalidate>
          <div class="login-field" [class.is-invalid]="isInvalid('userName')">
            <i class="bi bi-person login-field-icon"></i>
            <input
              formControlName="userName"
              type="text"
              [placeholder]="'ACCOUNT.LOGIN.EMAIL_LABEL' | translate"
              [attr.aria-label]="'ACCOUNT.LOGIN.EMAIL_LABEL' | translate"
              class="login-input"
            />
          </div>

          <div class="login-field" [class.is-invalid]="isInvalid('password')">
            <i class="bi bi-lock login-field-icon"></i>
            <input
              formControlName="password"
              [type]="passwordVisible ? 'text' : 'password'"
              [placeholder]="'ACCOUNT.LOGIN.PASSWORD_LABEL' | translate"
              [attr.aria-label]="'ACCOUNT.LOGIN.PASSWORD_LABEL' | translate"
              class="login-input"
            />
            <button
              type="button"
              class="login-field-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-pressed]="passwordVisible"
              [title]="
                (passwordVisible
                  ? 'ACCOUNT.LOGIN.HIDE_PASSWORD'
                  : 'ACCOUNT.LOGIN.SHOW_PASSWORD'
                ) | translate
              "
            >
              <i [ngClass]="passwordVisible ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>

          @if (errorMessages) {
            <app-validation-messages
              [errorMessages]="errorMessages"
            ></app-validation-messages>
          }

          <button
            [appClick]="login.bind(this)"
            type="submit"
            class="login-submit"
          >
            {{ 'ACCOUNT.LOGIN.SUBMIT' | translate }}
          </button>
        </form>

        <a class="login-forgot" routerLink="/account/reset-password">{{
          'ACCOUNT.LOGIN.FORGOT_PASSWORD' | translate
        }}</a>
      </div>
    </div>
  </div>
</div>
