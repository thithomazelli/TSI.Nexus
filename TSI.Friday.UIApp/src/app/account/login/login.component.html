      <div class="login-visual-content">
        <img
          src="assets/img/nexus/logo-full-dark.png"
          alt="Nexus"
          class="login-visual-logo"
        />
      </div>
    </div>

    <div class="login-panel">
      <div class="login-panel-inner">
        <h2 class="login-heading">{{ 'ACCOUNT.LOGIN.SUBMIT' | translate }}</h2>

        <form [formGroup]="form" (ngSubmit)="login()" novalidate>
          <div class="input-group mb-3">
            <div class="form-floating flex-fill">
              <input
                formControlName="userName"
                type="text"
                [placeholder]="'ACCOUNT.LOGIN.EMAIL_LABEL' | translate"
                class="form-control"
                id="loginUserName"
                [class.is-invalid]="isInvalid('userName')"
              />
              <label for="loginUserName">{{ 'ACCOUNT.LOGIN.EMAIL_LABEL' | translate }}</label>
            </div>
            <div class="input-group-text"><i class="bi bi-person"></i></div>
          </div>

          <div class="input-group mb-3">
            <div class="form-floating flex-fill">
              <input
                formControlName="password"
                [type]="passwordVisible ? 'text' : 'password'"
                [placeholder]="'ACCOUNT.LOGIN.PASSWORD_LABEL' | translate"
                class="form-control"
                id="loginPassword"
                [class.is-invalid]="isInvalid('password')"
              />
              <label for="loginPassword">{{ 'ACCOUNT.LOGIN.PASSWORD_LABEL' | translate }}</label>
            </div>
            <button
              type="button"
              class="input-group-text login-password-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-pressed]="passwordVisible"
              [title]="
                (passwordVisible
                  ? 'ACCOUNT.LOGIN.HIDE_PASSWORD'
                  : 'ACCOUNT.LOGIN.SHOW_PASSWORD'
                ) | translate
              "
            >
              <i [ngClass]="passwordVisible ? 'bi bi-eye-slash' : 'bi bi-eye'"></i>
            </button>
          </div>

          <div class="login-row">
            <label class="login-remember">
              <input type="checkbox" [(ngModel)]="rememberMe" [ngModelOptions]="{ standalone: true }" />
              <span>{{ 'ACCOUNT.LOGIN.REMEMBER_ME' | translate }}</span>
            </label>

            <a class="login-forgot" routerLink="/account/reset-password">{{
              'ACCOUNT.LOGIN.FORGOT_PASSWORD' | translate
            }}</a>
          </div>

          @if (errorMessages) {
            <app-validation-messages
              [errorMessages]="errorMessages"
            ></app-validation-messages>
          }

          <button
            [appClick]="login.bind(this)"
            type="submit"
            class="login-submit"
          >
            {{ 'ACCOUNT.LOGIN.SUBMIT' | translate }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
