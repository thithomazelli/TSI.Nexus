<div class="d-flex justify-content-center align-items-center">
  <div class="col-12 col-lg-5">
    <main class="for-signin">
      <form [formGroup]="loginForm" (ngSubmit)="login()" autocomplete="off">
        <div class="text-center mb-4">
          <h3 class="mb-3 font-weight-normal">Login</h3>
        </div>
        <div class="text-center mb-4">
          <h3 class="mb-3 font-weight-normal"></h3>
        </div>
        <div class="form-floating mb-3">
          <input
            formControlName="userName"
            type="text"
            placeholder="Email"
            class="form-control"
            [class.is-invalid]="canDisplayInputErrors('userName', loginForm)"
          />
          <label for="userName">Email</label>
          <span
            class="text-danger"
            *ngIf="inputHasError('userName', 'required', loginForm)"
            >Email is required
          </span>
        </div>
        <div class="form-floating mb-3">
          <input
            formControlName="password"
            type="password"
            placeholder="Password"
            class="form-control"
            [class.is-invalid]="canDisplayInputErrors('password', loginForm)"
          />
          <label for="password">Password</label>
          <span
            class="text-danger"
            *ngIf="inputHasError('password', 'required', loginForm)"
            >Password is required
          </span>
        </div>

        <div class="form-floating" *ngIf="errorMessages">
          <app-validation-messages
            [errorMessages]="errorMessages"
          ></app-validation-messages>
        </div>

        <div class="d-grid mt-4 px-1">
          <button class="btn btn-lg btn-info" type="submit">Log in</button>
        </div>
      </form>

      <div class="mt-4 text-center">
        <a
          class="btn btn-link"
          routerLink="/account/send-email/forgot-username-or-password"
        >
          <h6>Forgot username or password?</h6>
        </a>
      </div>
    </main>
  </div>
</div>
