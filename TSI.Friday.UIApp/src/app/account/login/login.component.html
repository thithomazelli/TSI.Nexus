<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <a class="link-dark" routerLink="/">
        <h1 class="mb-0"><b>Admin</b>LTE</h1>
      </a>
    </div>
    <div class="card-body login-card-body">
      <p class="login-box-msg">Sign in to start your session</p>

      <form [formGroup]="form" (ngSubmit)="login()" novalidate>
        <div class="input-group mb-1">
          <div class="form-floating flex-fill">
            <input
              formControlName="userName"
              type="text"
              placeholder="Email"
              class="form-control"
              [class.is-invalid]="isInvalid('userName')"
            />
            <label for="userName">Email</label>
            <span
              class="text-danger"
              *ngIf="inputHasError('userName', 'required')"
              >Email is required
            </span>
          </div>
          <div class="input-group-text"><i class="bi bi-envelope"></i></div>
        </div>

        <div class="input-group mb-1">
          <div class="form-floating flex-fill">
            <input
              formControlName="password"
              [type]="passwordVisible ? 'text' : 'password'"
              placeholder="Password"
              class="form-control"
              [class.is-invalid]="isInvalid('password')"
            />
            <label for="password">Password</label>
            <span
              class="text-danger"
              *ngIf="inputHasError('password', 'required')"
              >Password is required
            </span>
          </div>
          <!-- <div class="input-group-text"><i class="bi bi-lock-fill"></i></div> -->
          <!-- visibility toggle -->
          <button
            type="button"
            class="btn btn-outline-secondary"
            (click)="togglePasswordVisibility()"
            [attr.aria-pressed]="passwordVisible"
            [title]="passwordVisible ? 'Hide password' : 'Show password'"
          >
            <i
              [ngClass]="passwordVisible ? 'bi bi-eye-slash' : 'bi bi-eye'"
            ></i>
          </button>
        </div>

        <div class="form-floating" *ngIf="errorMessages">
          <app-validation-messages
            [errorMessages]="errorMessages"
          ></app-validation-messages>
        </div>

        <div class="row mb-2">
          <div class="col-8 d-inline-flex align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label"> Remember Me </label>
            </div>
          </div>
          <div class="col-4">
            <div class="d-grid">
              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="form.invalid"
              >
                Sign In
              </button>
            </div>
          </div>
        </div>
      </form>

      <div class="social-auth-links text-center mb-3 d-grid gap-2">
        <p>- OR -</p>
        <a class="btn btn-primary"
          ><i class="bi bi-facebook me-2"></i> Sign in using Facebook</a
        >
        <a class="btn btn-danger"
          ><i class="bi bi-google me-2"></i> Sign in using Google+</a
        >
      </div>

      <p class="mb-1">
        <a routerLink="/account/reset-password">I forgot my password</a>
      </p>
      <p class="mb-0">
        <a routerLink="/account/register" class="link-primary"
          >Register a new membership</a
        >
      </p>
    </div>
  </div>
</div>
