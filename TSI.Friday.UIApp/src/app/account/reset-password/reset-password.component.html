<div *ngIf="hasTokenAndEmail" class="d-flex justify-content-center">
  <div class="col-12 col-lg-5">
    <main class="form-signin">
      <form
        [formGroup]="form"
        class="form-signin"
        (ngSubmit)="resetPassword()"
        autocomplete="off"
      >
        <div class="text-center mb-4">
          <h1 class="mb-3 font-weight-normal">Change your password</h1>
        </div>

        <div class="form-floating mb-3">
          <input
            formControlName="email"
            type="text"
            placeholder="Email"
            class="form-control"
          />
          <label for="email">Email</label>
        </div>

        <div class="form-floating mb-3">
          <input
            formControlName="newPassword"
            type="password"
            placeholder="New password"
            class="form-control"
            [class.is-invalid]="isInvalid('newPassword')"
          />
          <label for="newPassword">New password</label>
          <span
            class="text-danger"
            *ngIf="inputHasError('newPassword', 'required')"
            >New password is required
          </span>
          <span
            class="text-danger"
            *ngIf="
              inputHasError('newPassword', 'minlength') ||
              inputHasError('newPassword', 'maxlength')
            "
            >New password must be at least 6, and maximum 15 characters
          </span>
        </div>

        <div class="form-floating" *ngIf="errorMessages">
          <app-validation-messages
            [errorMessages]="errorMessages"
          ></app-validation-messages>
        </div>

        <div class="row">
          <div class="col-6">
            <div class="d-grid">
              <button class="btn btn-block btn-success" type="submit">
                Change password
              </button>
            </div>
          </div>

          <div class="col-6">
            <div class="d-grid">
              <button
                class="btn btn-block btn-danger"
                type="button"
                routerLink="/account/login"
              >
                Cancel
              </button>
            </div>
          </div>
        </div>
      </form>
    </main>
  </div>
</div>
