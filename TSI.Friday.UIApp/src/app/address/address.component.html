<div class="app-content">
  <app-grid
    [className]="'COMMON.ADDRESS' | translate"
    [compactView]="true"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [baseEndPoint]="'addresses'"
    [refresh]="refreshAddresses.bind(this)"
    [delete]="deleteAddress.bind(this)"
    [update]="updateDefaultAddress.bind(this)"
    (openModal)="openModal($event)"
  ></app-grid>
</div>
