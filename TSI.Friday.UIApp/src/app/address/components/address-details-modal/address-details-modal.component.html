<div class="modal-header">
  <h5 class="modal-title">
    {{ isEdit ? "Editar Endereço" : "Adicionar Endereço" }}
  </h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <app-address-form
    [isEdit]="isEdit"
    [data]="data"
    (save)="save($event)"
    (cancel)="close()"
    [compact]="false"
    [errors]="errorMessages"
  ></app-address-form>
</div>
