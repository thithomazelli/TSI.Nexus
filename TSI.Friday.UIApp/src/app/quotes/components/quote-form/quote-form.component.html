<div class="quote-form-wrapper custom-modal">
  @if (isEdit) {
    <app-alert-banner-component
      [status]="data?.status"
      [entity]="'Orçamento'"
    ></app-alert-banner-component>
  }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="modal-scrollable-area">
      <section>
        <div class="row g-1 mb-1">
          <div *ngIf="isEdit" class="col-12 col-md-4">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="orderNumber"
                  type="text"
                  placeholder="Número do Orçamento"
                  class="form-control"
                  [class.is-invalid]="isInvalid('orderNumber')"
                  [class.is-valid]="isValid('orderNumber')"
                />
                <label for="orderNumber">Número do Orçamento</label>
              </div>
              <div class="input-group-text"><i class="bi bi-hash"></i></div>
            </div>
          </div>

          <div class="col-12" [ngClass]="isEdit ? 'col-md-8' : 'col-md-12'">
            <div class="input-group">
              <div class="form-floating">
                @if (!isEdit) {
                  <input
                    type="text"
                    formControlName="businessPartnerName"
                    class="form-control"
                    [matAutocomplete]="auto"
                    #firstInput
                    [class.is-invalid]="isInvalid('businessPartnerName')"
                    [class.is-valid]="isValid('businessPartnerName')"
                    placeholder="Cliente"
                    (blur)="onClientBlur()"
                  />
                  <label for="businessPartnerName">Cliente</label>
                  <mat-autocomplete #auto="matAutocomplete">
                    <mat-option
                      *ngFor="
                        let businessPartner of filteredBusinessPartners$ | async
                      "
                      [value]="businessPartner.name"
                    >
                      {{ businessPartner.name }}
                    </mat-option>
                  </mat-autocomplete>
                } @else {
                  <app-link-field
                    [placeHolder]="'Cliente'"
                    [text]="form.get('businessPartnerName')?.value || 'Cliente'"
                    [linkUrl]="[
                      '/clients',
                      form.get('businessPartnerId')?.value,
                    ]"
                  >
                  </app-link-field>
                }
              </div>
              <div class="input-group-text"><i class="bi bi-building"></i></div>
            </div>
          </div>

          <div *ngIf="!compact" class="col-12">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="description"
                  type="text"
                  placeholder="Descrição"
                  class="form-control"
                  [class.is-invalid]="isInvalid('description')"
                  [class.is-valid]="isValid('description')"
                />
                <label for="description">Descrição</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-card-text"></i>
              </div>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <app-date-field
              formControlName="date"
              [label]="'Data do Orçamento'"
            ></app-date-field>
          </div>

          <div class="col-12 col-md-5">
            <div class="input-group">
              <div class="form-floating flex-fill">
                <select
                  formControlName="status"
                  class="form-select"
                  [class.is-invalid]="isInvalid('status')"
                  [class.is-valid]="isValid('status')"
                >
                  <option
                    *ngFor="let s of quoteStatusOptions"
                    [value]="s.value"
                  >
                    {{ s.label }}
                  </option>
                </select>
                <label for="status">Status</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-info-circle"></i>
              </div>
            </div>
          </div>

          <div class="col-6 col-md-3">
            <div class="input-group">
              <div class="form-floating flex-fill">
                <input
                  formControlName="discount"
                  type="number"
                  min="0"
                  max="100"
                  placeholder="Desconto"
                  class="form-control"
                  [class.is-invalid]="isInvalid('discount')"
                  [class.is-valid]="isValid('discount')"
                />
                <label for="discount">Desconto</label>
              </div>
              <div class="input-group-text"><i class="bi bi-percent"></i></div>
            </div>
          </div>

          <div class="col-6">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="priceFormatted"
                  type="text"
                  placeholder="Preço"
                  class="form-control"
                  [class.is-invalid]="isInvalid('priceFormatted')"
                  [class.is-valid]="isValid('priceFormatted')"
                />
                <label for="price">Preço</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-cash-coin"></i>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="input-group">
              <div class="form-floating">
                <input
                  formControlName="totalPriceFormatted"
                  type="text"
                  placeholder="Preço Total"
                  class="form-control"
                  [class.is-invalid]="isInvalid('totalPriceFormatted')"
                  [class.is-valid]="isValid('totalPriceFormatted')"
                />
                <label for="totalPrice">Preço Total</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-cash-coin"></i>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Dados do Pagamento -->
      <section>
        <h5 class="mt-3 mb-2">Dados do Pagamento</h5>
        <div class="row g-1 mb-1">
          @if (!isEdit) {
            <div class="col-6">
              <div class="input-group">
                <div class="form-floating flex-fill select-floating">
                  <select
                    formControlName="condition"
                    class="form-select"
                    id="condition"
                    [class.is-invalid]="isInvalid('condition')"
                    [class.is-valid]="isValid('condition')"
                  >
                    <option value="" disabled selected>Condição</option>
                    @for (option of conditionOptions; track option) {
                      <option [value]="option.value">{{ option.label }}</option>
                    }
                  </select>
                  <label for="condition">Condição</label>
                </div>
                <div class="input-group-text">
                  <i class="bi bi-calendar2-week"></i>
                </div>
              </div>
            </div>
            <div class="col-6">
              <div class="input-group">
                <div class="form-floating flex-fill select-floating">
                  <select
                    formControlName="method"
                    class="form-select"
                    id="method"
                    [class.is-invalid]="isInvalid('method')"
                    [class.is-valid]="isValid('method')"
                  >
                    <option value="" disabled selected>Método</option>
                    @for (option of methodOptions; track option) {
                      <option [value]="option.value">{{ option.label }}</option>
                    }
                  </select>
                  <label for="method">Método</label>
                </div>
                <div class="input-group-text">
                  <i class="bi bi-credit-card"></i>
                </div>
              </div>
            </div>
          }

          <div class="col-6">
            <div class="input-group">
              <div class="form-floating flex-fill">
                <input
                  formControlName="totalOfPayments"
                  type="number"
                  min="0"
                  step="1"
                  placeholder="Total de Pagamentos"
                  class="form-control"
                  id="totalOfPayments"
                  [class.is-invalid]="isInvalid('totalOfPayments')"
                  [class.is-valid]="isValid('totalOfPayments')"
                />
                <label for="totalOfPayments">Total de Pagamentos</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-list-ol"></i>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="input-group">
              <div class="form-floating flex-grow-1">
                <input
                  formControlName="paymentTotalPriceFormatted"
                  type="text"
                  placeholder="Preço Total Pagamentos"
                  class="form-control"
                  [class.is-invalid]="isInvalid('paymentTotalPriceFormatted')"
                  [class.is-valid]="isValid('paymentTotalPriceFormatted')"
                  (blur)="onCurrencyBlur('paymentTotalPrice')"
                />
                <label for="paymentTotalPrice">Preço Total Pagamentos</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-cash-coin"></i>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="input-group">
              <div class="form-floating flex-fill">
                <input
                  formControlName="totalOfExpenses"
                  type="number"
                  min="0"
                  step="1"
                  placeholder="Total de Despesas"
                  class="form-control"
                  id="totalOfExpenses"
                  [class.is-invalid]="isInvalid('totalOfExpenses')"
                  [class.is-valid]="isValid('totalOfExpenses')"
                />
                <label for="totalOfExpenses">Total de Despesas</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-list-ol"></i>
              </div>
            </div>
          </div>

          <div class="col-6">
            <div class="input-group">
              <div class="form-floating flex-grow-1">
                <input
                  formControlName="expenseTotalPriceFormatted"
                  type="text"
                  placeholder="Preço Total Despesas"
                  class="form-control"
                  [class.is-invalid]="isInvalid('expenseTotalPriceFormatted')"
                  [class.is-valid]="isValid('expenseTotalPriceFormatted')"
                  (blur)="onCurrencyBlur('expenseTotalPrice')"
                />
                <label for="expenseTotalPrice">Preço Total Despesas</label>
              </div>
              <div class="input-group-text"><i class="bi bi-cash"></i></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Tabela de produtos do orçamento -->
      <section *ngIf="!isEdit" class="quote-products-table mt-2">
        <h5>Produtos</h5>
        <table class="table">
          <thead>
            <tr>
              <th class="table-header-title" scope="col">SKU</th>
              <th class="table-header-title" scope="col">Nome</th>
              <th class="table-header-title" scope="col">Preço Total</th>
              <th class="table-header-title" scope="col">Quantidade</th>
              <th class="" scope="col" style="width: 40px">
                <button class="address-link" (click)="openQuoteProductsModal()">
                  Adicionar
                </button>
              </th>
            </tr>
          </thead>
          <tbody class="table-group-divider table-body">
            <tr *ngFor="let item of data?.quoteProducts; let i = index">
              <td class="table-cell-info">{{ item.productSku }}</td>
              <td class="table-cell-info">{{ item.productName }}</td>
              <td class="table-cell-info">
                {{ item.totalPrice | currency: "BRL" }}
              </td>
              <td class="table-cell-info">{{ item.quantity }}</td>
              <td class="table-cell-info">
                <button
                  type="button"
                  class="btn btn-link p-0 text-danger"
                  title="Remover"
                  (click)="removeProduct(i)"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            <tr
              *ngIf="!data?.quoteProducts || data?.quoteProducts?.length === 0"
            >
              <td colspan="5" class="text-center text-muted small py-3">
                Nenhum produto adicionado
              </td>
            </tr>
          </tbody>
        </table>
      </section>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary me-2" (click)="cancel()">
        Cancelar
      </button>
      <button
        [appClick]="submit.bind(this)"
        type="submit"
        class="btn btn-success"
      >
        Salvar
      </button>
    </div>
  </form>
</div>
