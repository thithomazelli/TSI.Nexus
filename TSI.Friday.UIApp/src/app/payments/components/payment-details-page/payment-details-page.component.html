<app-header
  [title]="isEdit ? 'Editar Pagamento' : 'Adicionar Pagamento'"
  [navigationMenus]="[
    { label: 'Home', link: '/home' },
    { label: 'Pagamentos', link: '/payments' },
    { label: isEdit ? 'Editar Pagamento' : 'Adicionar Pagamento', link: '' },
  ]"
></app-header>
<section class="content">
  <div class="container-fluid">
    <div class="row">
      <div class="col-md-3">
        <!-- Profile Image -->
        <div class="card card-secondary card-outline">
          <div class="card-body box-profile">
            <div class="text-center">
              <!-- Pode adicionar um ícone ou resumo do pagamento aqui -->
              <div class="box-profile">
                <div class="text-center">
                  <i class="bi bi-cash-coin" style="font-size: 4rem"></i>
                  <ul class="list-group list-group-unbordered mb-3">
                    <li class="list-group-item">
                      <b>ID</b> <a class="float-right">{{ data?.id }}</a>
                    </li>
                    <li class="list-group-item">
                      <b>Tipo</b> <a class="float-right">{{ data?.type }}</a>
                    </li>
                    <li class="list-group-item">
                      <b>Status</b>
                      <a class="float-right">{{ data?.status }}</a>
                    </li>
                  </ul>
                </div>
              </div>
            </div>
          </div>
          <!-- /.card-body -->
        </div>
        <!-- /.card -->
      </div>
      <!-- /.col -->
      <div class="col-md-9">
        <div class="card card card-secondary card-outline">
          <div class="card-body">
            <ul class="nav nav-tabs mb-3">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  [class.active]="activeTab === 'details'"
                  (click)="activeTab = 'details'"
                  data-toggle="tab"
                  >Detalhes</a
                >
              </li>
              <li class="nav-item">
                <a
                  class="nav-link"
                  [class.active]="activeTab === 'payments'"
                  (click)="activeTab = 'payments'"
                  data-toggle="tab"
                  >Parcelas</a
                >
              </li>
            </ul>

            @if (loading) {
              <div class="text-center py-4">Carregando...</div>
            }

            @if (!loading) {
              <div>
                @if (activeTab === "details") {
                  <div>
                    <app-payment-form
                      [isEdit]="isEdit"
                      [data]="data"
                      [compact]="true"
                      (save)="save($event)"
                      (cancel)="cancel()"
                    ></app-payment-form>
                  </div>
                }
                @if (activeTab === "payments") {
                  <app-payment-installments
                    [entity]="'Payment'"
                    [data]="data"
                  ></app-payment-installments>
                }
              </div>
            }
          </div>
        </div>
        <!-- /.nav-tabs-custom -->
      </div>
      <!-- /.col -->
    </div>
    <!-- /.row -->
  </div>
  <!-- /.container-fluid -->
</section>
