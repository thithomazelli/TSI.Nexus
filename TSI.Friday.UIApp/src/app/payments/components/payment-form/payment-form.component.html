<div class="payment-form-wrapper">
  @if (isEdit) {
    <app-alert-banner-component
      [status]="data?.status"
      [entity]="'ORDERS.SINGULAR' | translate"
    ></app-alert-banner-component>
  }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="modal-scrollable-area">
      <div class="row g-1 mb-1">
        <ng-container>
          <div class="col-12 col-md-4">
            <div class="input-group">
              <div class="form-floating">
                <app-link-field
                  [placeHolder]="
                    form.get('tripNumber')?.value
                      ? ('TRIPS.TRIP_NUMBER' | translate)
                      : ('ORDERS.ORDER_NUMBER' | translate)
                  "
                  [text]="
                    form.get('tripNumber')?.value ||
                    form.get('orderNumber')?.value ||
                    'N/A'
                  "
                  [linkUrl]="
                    form.get('tripNumber')?.value
                      ? ['/trips', form.get('tripId')?.value]
                      : form.get('orderNumber')?.value
                        ? ['/orders', form.get('orderId')?.value]
                        : []
                  "
                >
                </app-link-field>
              </div>
              <div class="input-group-text"><i class="bi bi-hash"></i></div>
            </div>
          </div>

          <div class="col-12 col-md-8">
            <div class="input-group">
              <div class="form-floating">
                <app-link-field
                  [placeHolder]="'BUSINESS_PARTNER.CLIENT_SINGULAR' | translate"
                  [text]="form.get('businessPartnerName')?.value || 'N/A'"
                  [linkUrl]="
                    form.get('businessPartnerName')?.value
                      ? ['/clients', form.get('businessPartnerId')?.value]
                      : []
                  "
                >
                </app-link-field>
              </div>
              <div class="input-group-text"><i class="bi bi-building"></i></div>
            </div>
          </div>
        </ng-container>

        <div class="col-12 col-md-6">
          <div class="input-group">
            <div class="form-floating">
              <app-link-field
                [placeHolder]="'TRANSACTIONS.SINGULAR' | translate"
                [text]="form.get('transactionDescription')?.value || 'N/A'"
                [linkUrl]="
                  form.get('transactionDescription')?.value
                    ? ['/transactions', form.get('transactionId')?.value]
                    : []
                "
              >
              </app-link-field>
            </div>
            <div class="input-group-text">
              <i class="bi bi-cash-stack"></i>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6">
          <div class="input-group">
            <div class="form-floating flex-fill select-floating">
              <select
                formControlName="type"
                class="form-select"
                id="type"
                [class.is-invalid]="isInvalid('type')"
                [class.is-valid]="isValid('type')"
              >
                <option value="" disabled selected>{{ 'COMMON.TYPE' | translate }}</option>
                @for (option of typeOptions; track option.value) {
                  <option [value]="option.value">{{ option.label }}</option>
                }
              </select>
              <label for="type">{{ 'COMMON.TYPE' | translate }}</label>
            </div>
            <div class="input-group-text">
              <i class="bi bi-credit-card-2-front"></i>
            </div>
          </div>
        </div>

        <div class="col-12">
          <div class="input-group">
            <div class="form-floating flex-fill">
              <input
                formControlName="description"
                type="text"
                [placeholder]="'COMMON.DESCRIPTION' | translate"
                class="form-control"
                id="description"
              />
              <label for="description">{{ 'COMMON.DESCRIPTION' | translate }}</label>
            </div>
            <div class="input-group-text"><i class="bi bi-card-text"></i></div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="input-group">
            <div class="form-floating flex-fill select-floating">
              <select
                formControlName="method"
                class="form-select"
                id="method"
                [class.is-invalid]="isInvalid('method')"
                [class.is-valid]="isValid('method')"
              >
                <option value="" disabled selected>{{ 'TRANSACTIONS.METHOD' | translate }}</option>
                @for (option of methodOptions; track option.value) {
                  <option [value]="option.value">{{ option.label }}</option>
                }
              </select>
              <label for="method">{{ 'TRANSACTIONS.METHOD' | translate }}</label>
            </div>
            <div class="input-group-text">
              <i class="bi bi-credit-card"></i>
            </div>
          </div>
        </div>

        <!-- Second line: businessPartnerId and orderId -->
        @if (showClientAndOrder) {
          <div class="row g-1 mb-1">
            <div class="col-md-6">
              <div class="input-group">
                <div class="form-floating flex-fill">
                  <input
                    formControlName="businessPartnerName"
                    type="text"
                    [placeholder]="'BUSINESS_PARTNER.CLIENT_SINGULAR' | translate"
                    class="form-control"
                    id="businessPartnerName"
                  />
                  <label for="businessPartnerName">{{ 'BUSINESS_PARTNER.CLIENT_SINGULAR' | translate }}</label>
                </div>
                <div class="input-group-text"><i class="bi bi-person"></i></div>
              </div>
            </div>
            <div class="col-md-6">
              <div class="input-group">
                <div class="form-floating flex-fill">
                  <input
                    formControlName="orderNumber"
                    type="text"
                    [placeholder]="'ORDERS.ORDER_NUMBER' | translate"
                    class="form-control"
                    id="orderNumber"
                  />
                  <label for="orderNumber">{{ 'ORDERS.ORDER_NUMBER' | translate }}</label>
                </div>
                <div class="input-group-text"><i class="bi bi-hash"></i></div>
              </div>
            </div>
          </div>
        }

        <!-- Third line: status and date -->
        <div class="col-md-6">
          <div class="input-group">
            <div class="form-floating flex-fill select-floating">
              <select
                formControlName="status"
                class="form-select"
                id="status"
                [class.is-invalid]="isInvalid('status')"
                [class.is-valid]="isValid('status')"
              >
                <option value="" disabled selected>{{ 'COMMON.STATUS' | translate }}</option>
                @for (option of statusOptions; track option.value) {
                  <option [value]="option.value">{{ option.label }}</option>
                }
              </select>
              <label for="status">{{ 'COMMON.STATUS' | translate }}</label>
            </div>
            <div class="input-group-text">
              <i class="bi bi-info-circle"></i>
            </div>
          </div>
        </div>

        <div class="col-6">
          <div class="input-group">
            <div class="form-floating flex-fill select-floating">
              <select
                formControlName="condition"
                class="form-select"
                id="condition"
                [class.is-invalid]="isInvalid('condition')"
                [class.is-valid]="isValid('condition')"
              >
                <option value="" disabled selected>{{ 'TRANSACTIONS.CONDITION' | translate }}</option>
                @for (option of conditionOptions; track option.value) {
                  <option [value]="option.value">{{ option.label }}</option>
                }
              </select>
              <label for="condition">{{ 'TRANSACTIONS.CONDITION' | translate }}</label>
            </div>
            <div class="input-group-text">
              <i class="bi bi-calendar2-week"></i>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="input-group">
            <div class="form-floating flex-fill select-floating">
              <select
                formControlName="category"
                class="form-select"
                id="category"
                [class.is-invalid]="isInvalid('category')"
                [class.is-valid]="isValid('category')"
              >
                <option value="" disabled selected>{{ 'VEHICLES.CATEGORY' | translate }}</option>
                @for (option of categories; track option.id) {
                  <option [value]="option.value">{{ option.value }}</option>
                }
              </select>
              <label for="category">{{ 'VEHICLES.CATEGORY' | translate }}</label>
            </div>
            <div class="input-group-text"><i class="bi bi-tags"></i></div>
          </div>
        </div>

        <div class="col-6">
          <app-date-field
            formControlName="date"
            [label]="'TRANSACTIONS.PAYMENT_DATE' | translate"
            [isDisabled]="data?.status === 'Approved'"
          ></app-date-field>
        </div>

        <div class="col-md-6">
          <div class="input-group">
            <div class="form-floating flex-grow-1">
              <input
                formControlName="priceFormatted"
                type="text"
                [placeholder]="'COMMON.VALUE' | translate"
                class="form-control"
                [class.is-invalid]="isInvalid('priceFormatted')"
                [class.is-valid]="isValid('priceFormatted')"
                (blur)="onCurrencyBlur('price')"
              />
              <label for="price">{{ 'COMMON.VALUE' | translate }}</label>
            </div>
            <div class="input-group-text"><i class="bi bi-cash-coin"></i></div>
          </div>
        </div>

        @if (isInstallment) {
          <div class="col-md-6">
            <div class="input-group">
              <div class="form-floating flex-fill">
                <input
                  formControlName="totalOfPayments"
                  type="number"
                  min="1"
                  step="1"
                  [placeholder]="'TRANSACTIONS.TOTAL_OF_PAYMENTS' | translate"
                  class="form-control"
                  id="totalOfPayments"
                  [class.is-invalid]="isInvalid('totalOfPayments')"
                  [class.is-valid]="isValid('totalOfPayments')"
                />
                <label for="totalOfPayments">{{ 'TRANSACTIONS.TOTAL_OF_PAYMENTS' | translate }}</label>
              </div>
              <div class="input-group-text">
                <i class="bi bi-list-ol"></i>
              </div>
            </div>
          </div>
          <div class="col-md-6">
            <div class="input-group">
              <div class="form-floating flex-grow-1">
                <input
                  formControlName="priceFormatted"
                  type="text"
                  [placeholder]="'COMMON.VALUE' | translate"
                  class="form-control"
                  [class.is-invalid]="isInvalid('priceFormatted')"
                  [class.is-valid]="isValid('priceFormatted')"
                  (blur)="onCurrencyBlur('price')"
                />
                <label for="priceFormatted">{{ 'COMMON.VALUE' | translate }}</label>
              </div>
              <div class="input-group-text"><i class="bi bi-cash"></i></div>
            </div>
          </div>
        }
      </div>
    </div>
    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary me-2" (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
      @if (isEdit) {
        <button (click)="remove()" type="button" class="btn btn-danger me-2">{{ 'COMMON.REMOVE' | translate }}</button>
      }
      <button
        [appClick]="submit.bind(this)"
        type="submit"
        class="btn btn-success"
      >
        {{ (isEdit ? 'COMMON.SAVE' : 'COMMON.ADD') | translate }}
      </button>
    </div>
  </form>
</div>
