<div class="modal-header">
  <h5 class="modal-title">{{ (isEdit ? 'VEHICLES.EDIT_REFUEL' : 'VEHICLES.NEW_REFUEL') | translate }}</h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <app-fuel-log-form
    [isModal]="true"
    [isEdit]="isEdit"
    [data]="data"
    [vehicleId]="vehicleId"
    [dialogRef]="dialogRef"
    [compact]="true"
  ></app-fuel-log-form>
</div>
