<div class="modal-header">
  <h5 class="modal-title">{{ isEdit ? 'Editar Abastecimento' : 'Novo Abastecimento' }}</h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row g-2">
      <div class="col-12 col-md-6">
        <app-date-field formControlName="date" [label]="'Data'"></app-date-field>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="odometer"
              type="number"
              min="0"
              placeholder="Odômetro"
              class="form-control"
              id="fuelLogModalOdometer"
            />
            <label for="fuelLogModalOdometer">Odômetro</label>
          </div>
          <div class="input-group-text"><i class="bi bi-speedometer2"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="liters"
              type="number"
              min="0"
              step="0.01"
              placeholder="Litros"
              class="form-control"
              id="fuelLogModalLiters"
            />
            <label for="fuelLogModalLiters">Litros</label>
          </div>
          <div class="input-group-text"><i class="bi bi-droplet"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="pricePerLiter"
              type="number"
              min="0"
              step="0.01"
              placeholder="Preço/litro"
              class="form-control"
              id="fuelLogModalPricePerLiter"
            />
            <label for="fuelLogModalPricePerLiter">Preço/litro</label>
          </div>
          <div class="input-group-text"><i class="bi bi-cash-coin"></i></div>
        </div>
      </div>
      <div class="col-12">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="gasStation"
              type="text"
              placeholder="Posto"
              class="form-control"
              id="fuelLogModalGasStation"
            />
            <label for="fuelLogModalGasStation">Posto</label>
          </div>
          <div class="input-group-text"><i class="bi bi-fuel-pump"></i></div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary btn-sm me-2" (click)="close()">
        Cancelar
      </button>
      <button type="submit" class="btn btn-success btn-sm" [disabled]="saving">
        {{ isEdit ? 'Salvar' : 'Adicionar' }}
      </button>
    </div>
  </form>
</div>
