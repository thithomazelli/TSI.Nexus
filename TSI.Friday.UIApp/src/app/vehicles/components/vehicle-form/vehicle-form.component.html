<div class="vehicle-form-wrapper">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="row g-1 mb-1">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="plate"
              type="text"
              placeholder="Placa"
              class="form-control"
              id="plate"
              [class.is-invalid]="isInvalid('plate')"
              [class.is-valid]="isValid('plate')"
            />
            <label for="plate">Placa</label>
          </div>
          <div class="input-group-text"><i class="bi bi-card-heading"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="renavam"
              type="text"
              placeholder="Renavam"
              class="form-control"
              id="renavam"
            />
            <label for="renavam">Renavam</label>
          </div>
          <div class="input-group-text"><i class="bi bi-file-text"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="chassis"
              type="text"
              placeholder="Chassi"
              class="form-control"
              id="chassis"
            />
            <label for="chassis">Chassi</label>
          </div>
          <div class="input-group-text"><i class="bi bi-upc-scan"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="brand"
              type="text"
              placeholder="Marca"
              class="form-control"
              id="brand"
              [class.is-invalid]="isInvalid('brand')"
              [class.is-valid]="isValid('brand')"
            />
            <label for="brand">Marca</label>
          </div>
          <div class="input-group-text"><i class="bi bi-truck"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="model"
              type="text"
              placeholder="Modelo"
              class="form-control"
              id="model"
              [class.is-invalid]="isInvalid('model')"
              [class.is-valid]="isValid('model')"
            />
            <label for="model">Modelo</label>
          </div>
          <div class="input-group-text"><i class="bi bi-truck-front"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="manufactureYear"
              type="number"
              placeholder="Ano fabricação"
              class="form-control"
              id="manufactureYear"
            />
            <label for="manufactureYear">Ano fabricação</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="modelYear"
              type="number"
              placeholder="Ano modelo"
              class="form-control"
              id="modelYear"
            />
            <label for="modelYear">Ano modelo</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="seatCapacity"
              type="number"
              placeholder="Capacidade de lugares"
              class="form-control"
              id="seatCapacity"
              [class.is-invalid]="isInvalid('seatCapacity')"
              [class.is-valid]="isValid('seatCapacity')"
            />
            <label for="seatCapacity">Lugares</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="odometer"
              type="number"
              placeholder="Odômetro (km)"
              class="form-control"
              id="odometer"
            />
            <label for="odometer">Odômetro (km)</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill select-floating">
            <select
              formControlName="type"
              class="form-select"
              id="type"
              [class.is-invalid]="isInvalid('type')"
              [class.is-valid]="isValid('type')"
            >
              @for (option of typeOptions; track option) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
            <label for="type">Tipo de veículo</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill select-floating">
            <select
              formControlName="status"
              class="form-select"
              id="status"
              [class.is-invalid]="isInvalid('status')"
              [class.is-valid]="isValid('status')"
            >
              @for (option of statusOptions; track option) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
            <label for="status">Status</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="pricePerKmFormatted"
              type="text"
              placeholder="Preço por km"
              class="form-control"
              [class.is-invalid]="isInvalid('pricePerKmFormatted')"
              [class.is-valid]="isValid('pricePerKmFormatted')"
              (blur)="onPricePerKmBlur()"
            />
            <label>R$ por km rodado</label>
          </div>
          <div class="input-group-text"><i class="bi bi-signpost-split"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="dailyRateFormatted"
              type="text"
              placeholder="Diária"
              class="form-control"
              [class.is-invalid]="isInvalid('dailyRateFormatted')"
              [class.is-valid]="isValid('dailyRateFormatted')"
              (blur)="onDailyRateBlur()"
            />
            <label>Diária</label>
          </div>
          <div class="input-group-text"><i class="bi bi-cash-coin"></i></div>
        </div>
      </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary me-2" (click)="cancel()">
        Cancelar
      </button>
      @if (isEdit) {
        <button (click)="remove()" type="button" class="btn btn-danger me-2">
          Remover
        </button>
      }
      <button type="submit" class="btn btn-success">
        {{ isEdit ? "Salvar" : "Adicionar" }}
      </button>
    </div>
  </form>
</div>
