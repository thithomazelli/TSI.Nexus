<app-header
  [title]="isEdit ? 'Editar Veículo' : 'Adicionar Veículo'"
  [navigationMenus]="[
    { label: 'COMMON.HOME' | translate, link: '/home' },
    { label: 'Frota', link: '/vehicles' },
    { label: isEdit ? 'Editar Veículo' : 'Adicionar Veículo', link: '' },
  ]"
></app-header>
<section class="content">
  <div class="container-fluid">
    <div class="card card-secondary card-outline">
      <div class="card-body">
        @if (isEdit) {
          <ul class="nav nav-tabs mb-3">
            <li class="nav-item">
              <a
                class="nav-link"
                [class.active]="activeTab === 'details'"
                (click)="activeTab = 'details'"
                data-toggle="tab"
                >Dados</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                [class.active]="activeTab === 'maintenances'"
                (click)="activeTab = 'maintenances'"
                data-toggle="tab"
                >Manutenções</a
              >
            </li>
            <li class="nav-item">
              <a
                class="nav-link"
                [class.active]="activeTab === 'fuel'"
                (click)="activeTab = 'fuel'"
                data-toggle="tab"
                >Combustível</a
              >
            </li>
          </ul>
        }

        @if (loading) {
          <div class="text-center py-4">{{ 'COMMON.LOADING' | translate }}</div>
        }
        @if (!loading) {
          @if (activeTab === 'details') {
            <app-vehicle-form [isEdit]="isEdit" [data]="data"></app-vehicle-form>
          }
          @if (activeTab === 'maintenances' && data?.id) {
            <app-vehicle-maintenance-list
              [vehicleId]="data!.id"
            ></app-vehicle-maintenance-list>
          }
          @if (activeTab === 'fuel' && data?.id) {
            <app-fuel-log-list [vehicleId]="data!.id"></app-fuel-log-list>
          }
        }
      </div>
    </div>
  </div>
</section>
