<div class="modal-header">
  <h5 class="modal-title">{{ (isEdit ? 'VEHICLES.EDIT_MAINTENANCE' : 'VEHICLES.NEW_MAINTENANCE') | translate }}</h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="modal-scrollable-area">
    <div class="row g-2">
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill select-floating">
            <select formControlName="type" class="form-select" id="maintenanceModalType">
              @for (option of typeOptions; track option) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
            <label for="maintenanceModalType">{{ 'COMMON.TYPE' | translate }}</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <app-date-field
          formControlName="scheduledDate"
          [label]="'VEHICLES.SCHEDULED_DATE' | translate"
        ></app-date-field>
      </div>
      <div class="col-12">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="description"
              type="text"
              [placeholder]="'COMMON.DESCRIPTION' | translate"
              class="form-control"
              id="maintenanceModalDescription"
            />
            <label for="maintenanceModalDescription">{{ 'COMMON.DESCRIPTION' | translate }}</label>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="cost"
              type="number"
              min="0"
              [placeholder]="'VEHICLES.COST' | translate"
              class="form-control"
              id="maintenanceModalCost"
            />
            <label for="maintenanceModalCost">{{ 'VEHICLES.COST' | translate }}</label>
          </div>
          <div class="input-group-text"><i class="bi bi-cash-coin"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="partQuantity"
              type="number"
              min="0"
              [placeholder]="'COMMON.QUANTITY' | translate"
              class="form-control"
              id="maintenanceModalPartQuantity"
            />
            <label for="maintenanceModalPartQuantity">{{ 'COMMON.QUANTITY' | translate }}</label>
          </div>
        </div>
      </div>
      <div class="col-12">
        <div class="input-group">
          <div class="form-floating flex-fill select-floating">
            <select formControlName="productId" class="form-select" id="maintenanceModalProduct">
              <option [ngValue]="null">{{ 'VEHICLES.NONE' | translate }}</option>
              @for (product of products; track product.id) {
                <option [ngValue]="product.id">
                  {{ product.sku }} - {{ product.name }} ({{ 'VEHICLES.PRODUCT_STOCK' | translate: { qty: product.quantityInStock + '' } }})
                </option>
              }
            </select>
            <label for="maintenanceModalProduct">{{ 'VEHICLES.CONSUMED_PART' | translate }}</label>
          </div>
        </div>
      </div>
    </div>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary btn-sm me-2" (click)="close()">{{ 'COMMON.CANCEL' | translate }}</button>
      <button type="submit" class="btn btn-success btn-sm" [disabled]="saving">
        {{ (isEdit ? 'COMMON.SAVE' : 'COMMON.ADD') | translate }}
      </button>
    </div>
  </form>
</div>
