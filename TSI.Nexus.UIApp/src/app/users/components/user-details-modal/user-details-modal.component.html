<div class="modal-header">
  <h5 class="modal-title">
    {{ isEdit ? "Editar Usuário" : "Adicionar Usuário" }}
  </h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <app-user-form
    [isModal]="true"
    [isEdit]="isEdit"
    [data]="data"
    [dialogRef]="dialogRef"
    [compact]="false"
  ></app-user-form>
</div>
