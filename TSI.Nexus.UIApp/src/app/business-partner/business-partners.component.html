<app-header
  [title]="title"
  [navigationMenus]="[
    { label: 'Home', link: '/home' },
    { label: title, link: '' },
  ]"
></app-header>

<div class="app-content">
  <app-grid
    [baseEndPoint]="baseEndPoint"
    [className]="title"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [refresh]="refreshBusinessPartners.bind(this)"
    [delete]="deleteBusinessPartner.bind(this)"
    (openModal)="openModal($event)"
  ></app-grid>
</div>
