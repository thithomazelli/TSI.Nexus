<div class="modal-header">
  <h5 class="modal-title">{{ 'PHOTO.CROP_TITLE' | translate }}</h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body image-crop-body">
  <div class="cropper-wrapper" (wheel)="onWheelZoom($event)">
    <image-cropper
      [imageFile]="source"
      [maintainAspectRatio]="true"
      [aspectRatio]="1"
      [roundCropper]="true"
      [allowMoveImage]="true"
      [cropperStaticWidth]="frameSize"
      [cropperStaticHeight]="frameSize"
      [transform]="transform"
      [output]="'blob'"
      [format]="'png'"
      (imageCropped)="onImageCropped($event)"
      (transformChange)="onTransformChange($event)"
    ></image-cropper>
  </div>

  <div class="zoom-control d-flex align-items-center gap-2 mt-3">
    <button
      type="button"
      class="btn-zoom"
      (click)="onZoomStep(-1)"
      [attr.aria-label]="'PHOTO.ZOOM_OUT' | translate"
    >
      <i class="bi bi-zoom-out"></i>
    </button>
    <input
      type="range"
      min="1"
      max="3"
      step="0.05"
      [value]="zoom"
      (input)="onZoomChange($event)"
      class="form-range flex-fill"
      [attr.aria-label]="'PHOTO.ZOOM' | translate"
    />
    <button
      type="button"
      class="btn-zoom"
      (click)="onZoomStep(1)"
      [attr.aria-label]="'PHOTO.ZOOM_IN' | translate"
    >
      <i class="bi bi-zoom-in"></i>
    </button>
  </div>
</div>

<div class="modal-footer d-flex justify-content-end gap-2">
  <button type="button" class="btn btn-secondary btn-sm" (click)="close()">
    {{ 'COMMON.CANCEL' | translate }}
  </button>
  <button type="button" class="btn btn-success btn-sm" (click)="confirm()">
    {{ 'PHOTO.SET_NEW_PHOTO' | translate }}
  </button>
</div>
