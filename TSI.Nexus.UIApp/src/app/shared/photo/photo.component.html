<div class="photo-component mb-3">
  <div class="dropdown photo-dropdown">
    <button
      type="button"
      class="photo-preview d-flex align-items-center justify-content-center photo-clickable btn p-0 border-0 bg-transparent"
      data-bs-toggle="dropdown"
      data-bs-auto-close="outside"
      [attr.aria-label]="'PHOTO.CLICK_TO_CHANGE_PHOTO' | translate"
    >
      <div class="photo-wrapper position-relative">
        <img
          class="profile-user-img img-fluid img-circle"
          [src]="imageUrl"
          (error)="onImgError($event)"
        />
        <div class="photo-hover-overlay">
          <span>{{ 'PHOTO.CLICK_TO_CHANGE' | translate }}</span>
        </div>
      </div>
    </button>

    <ul class="dropdown-menu">
      <li>
        <button type="button" class="dropdown-item" (click)="triggerFile()">
          <i class="bi bi-upload"></i> {{ 'PHOTO.UPLOAD_OPTION' | translate }}
        </button>
      </li>
      <li>
        <button type="button" class="dropdown-item" (click)="openCamera()">
          <i class="bi bi-camera"></i> {{ 'PHOTO.TAKE_PHOTO' | translate }}
        </button>
      </li>
      <li>
        <button
          type="button"
          class="dropdown-item text-danger"
          (click)="removePhotoConfirm()"
        >
          <i class="bi bi-trash"></i> {{ 'COMMON.REMOVE' | translate }}
        </button>
      </li>
    </ul>
  </div>

  <input
    #fileInput
    type="file"
    accept="image/*"
    class="d-none"
    (change)="onFileSelected($event)"
  />

  <div class="box-profile">
    <div class="text-center">
      <h3 class="profile-username text-center">
        {{ data?.name || data?.firstName }}
      </h3>
      <p *ngIf="canDisplaySubtitle" class="text-muted text-center">
        {{ data?.sku || data?.email }}
      </p>
    </div>
  </div>
</div>
