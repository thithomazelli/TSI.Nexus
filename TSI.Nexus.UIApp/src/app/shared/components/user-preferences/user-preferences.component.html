<div class="user-preferences" [class.compact]="compact">
  <div *ngIf="!compact" class="fw-bold mb-2">
    {{ 'PREFERENCES.TITLE' | translate }}
  </div>

  <div
    *ngIf="themeService.theme$ | async as currentTheme"
    class="d-flex align-items-center justify-content-between mb-2"
  >
    <label class="mb-0 small text-muted">{{
      'PREFERENCES.THEME_LABEL' | translate
    }}</label>
    <div class="btn-group btn-group-sm theme-switch" role="radiogroup">
      <button
        type="button"
        class="btn"
        role="radio"
        [class.active]="currentTheme === 'light'"
        [attr.aria-checked]="currentTheme === 'light'"
        [disabled]="saving"
        [title]="'PREFERENCES.THEME_LIGHT' | translate"
        (click)="onThemeSelect('light')"
      >
        <i class="bi bi-sun-fill"></i>
      </button>
      <button
        type="button"
        class="btn"
        role="radio"
        [class.active]="currentTheme === 'dark'"
        [attr.aria-checked]="currentTheme === 'dark'"
        [disabled]="saving"
        [title]="'PREFERENCES.THEME_DARK' | translate"
        (click)="onThemeSelect('dark')"
      >
        <i class="bi bi-moon-stars-fill"></i>
      </button>
    </div>
  </div>

  <div class="d-flex align-items-center justify-content-between gap-2">
    <label class="mb-0 small text-muted">{{
      'PREFERENCES.LANGUAGE_LABEL' | translate
    }}</label>
    <div class="btn-group btn-group-sm language-switch" role="radiogroup">
      <button
        type="button"
        class="btn"
        role="radio"
        [class.active]="translationService.current === 'pt-BR'"
        [attr.aria-checked]="translationService.current === 'pt-BR'"
        [disabled]="saving"
        title="Português"
        (click)="onLanguageChange('pt-BR')"
      >
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true">
          <rect width="20" height="14" fill="#009739" />
          <polygon points="10,2 18,7 10,12 2,7" fill="#FEDD00" />
          <circle cx="10" cy="7" r="3.2" fill="#012169" />
        </svg>
      </button>
      <button
        type="button"
        class="btn"
        role="radio"
        [class.active]="translationService.current === 'en'"
        [attr.aria-checked]="translationService.current === 'en'"
        [disabled]="saving"
        title="English"
        (click)="onLanguageChange('en')"
      >
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true">
          <rect width="20" height="14" fill="#B22234" />
          <g fill="#fff">
            <rect y="1.08" width="20" height="1.08" />
            <rect y="3.23" width="20" height="1.08" />
            <rect y="5.38" width="20" height="1.08" />
            <rect y="7.54" width="20" height="1.08" />
            <rect y="9.69" width="20" height="1.08" />
            <rect y="11.85" width="20" height="1.08" />
          </g>
          <rect width="8" height="7.54" fill="#3C3B6E" />
        </svg>
      </button>
      <button
        type="button"
        class="btn"
        role="radio"
        [class.active]="translationService.current === 'es'"
        [attr.aria-checked]="translationService.current === 'es'"
        [disabled]="saving"
        title="Español"
        (click)="onLanguageChange('es')"
      >
        <svg viewBox="0 0 20 14" width="20" height="14" aria-hidden="true">
          <rect width="20" height="14" fill="#AA151B" />
          <rect y="3.5" width="20" height="7" fill="#F1BF00" />
        </svg>
      </button>
    </div>
  </div>
</div>
