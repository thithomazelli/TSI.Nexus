<div class="loading-spinner text-center py-4">
  <svg
    class="loading-spinner-icon"
    width="32"
    height="32"
    viewBox="0 0 50 50"
    aria-hidden="true"
  >
    <circle
      cx="25"
      cy="25"
      r="20"
      fill="none"
      stroke="currentColor"
      stroke-width="5"
      stroke-linecap="round"
      stroke-dasharray="31.415, 31.415"
    >
      <animateTransform
        attributeName="transform"
        type="rotate"
        from="0 25 25"
        to="360 25 25"
        dur="1s"
        repeatCount="indefinite"
      />
    </circle>
  </svg>
  <div class="mt-2 text-muted small">{{ 'COMMON.LOADING' | translate }}</div>
</div>
