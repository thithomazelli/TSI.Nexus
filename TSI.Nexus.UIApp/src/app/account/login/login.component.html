<div class="login-bg">
  <div class="blur-bg-overlay"></div>
  <div class="login-page-bg">
    <div class="form-popup">
      <div class="form-box login">
        <div class="form-details"></div>
        <div class="form-content">
          <h2>LOGIN</h2>
          <form [formGroup]="form" (ngSubmit)="login()" novalidate>
            <div class="input-group mb-1">
              <div class="form-floating flex-fill">
                <input
                  formControlName="userName"
                  type="text"
                  placeholder="Email"
                  class="form-control"
                  [class.is-invalid]="isInvalid('userName')"
                />
                <label for="userName">E-mail</label>
              </div>
              <div class="input-group-text"><i class="bi bi-envelope"></i></div>
            </div>

            <div class="input-group mb-1">
              <div class="form-floating flex-fill">
                <input
                  formControlName="password"
                  [type]="passwordVisible ? 'text' : 'password'"
                  placeholder="Senha"
                  class="form-control"
                  [class.is-invalid]="isInvalid('password')"
                />
                <label for="password">Senha</label>
              </div>
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="togglePasswordVisibility()"
                [attr.aria-pressed]="passwordVisible"
                [title]="passwordVisible ? 'Hide password' : 'Show password'"
              >
                <i
                  [ngClass]="passwordVisible ? 'bi bi-eye-slash' : 'bi bi-eye'"
                ></i>
              </button>
            </div>

            @if (errorMessages) {
              <div class="form-floating">
                <app-validation-messages
                  [errorMessages]="errorMessages"
                ></app-validation-messages>
              </div>
            }

            <div class="d-grid mb-2">
              <button
                [appClick]="login.bind(this)"
                type="submit"
                class="btn btn-info text-white"
              >
                Entrar
              </button>
            </div>
          </form>

          <!-- <div class="col-8 d-inline-flex align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label">Lembre-se de mim</label>
            </div>
          </div> -->
          <p class="mb-1">
            <a routerLink="/account/reset-password">Esqueci minha senha</a>
          </p>
        </div>
      </div>
    </div>

    <div class="login-box" hidden>
      <div class="card card-outline card-primary">
        <div class="card-header">
          <div class="company-brand">
            <img src="assets/img/logo.png" alt="Logo" class="company-logo" />
            <span class="company-name"><b>Bianchi Caçambas</b></span>
          </div>
        </div>

        <div class="card-body login-card-body">
          <p class="login-box-msg">Inicie a sua sessão</p>

          <form [formGroup]="form" (ngSubmit)="login()" novalidate>
            <div class="input-group mb-1">
              <div class="form-floating flex-fill">
                <input
                  formControlName="userName"
                  type="text"
                  placeholder="Email"
                  class="form-control"
                  [class.is-invalid]="isInvalid('userName')"
                />
                <label for="userName">E-mail</label>
              </div>
              <div class="input-group-text"><i class="bi bi-envelope"></i></div>
            </div>

            <div class="input-group mb-1">
              <div class="form-floating flex-fill">
                <input
                  formControlName="password"
                  [type]="passwordVisible ? 'text' : 'password'"
                  placeholder="Senha"
                  class="form-control"
                  [class.is-invalid]="isInvalid('password')"
                />
                <label for="password">Senha</label>
              </div>
              <button
                type="button"
                class="btn btn-outline-secondary"
                (click)="togglePasswordVisibility()"
                [attr.aria-pressed]="passwordVisible"
                [title]="passwordVisible ? 'Hide password' : 'Show password'"
              >
                <i
                  [ngClass]="passwordVisible ? 'bi bi-eye-slash' : 'bi bi-eye'"
                ></i>
              </button>
            </div>

            @if (errorMessages) {
              <div class="form-floating">
                <app-validation-messages
                  [errorMessages]="errorMessages"
                ></app-validation-messages>
              </div>
            }

            <div class="row mb-2">
              <div class="col-8 d-inline-flex align-items-center">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="remember"
                  />
                  <label class="form-check-label">Lembre-se de mim</label>
                </div>
              </div>
              <div class="col-4">
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary">Entrar</button>
                </div>
              </div>
            </div>
          </form>

          <p class="mb-1">
            <a routerLink="/account/reset-password">Esqueci minha senha</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
