<div class="modal-header">
  <h5 class="modal-title">
    {{ isEdit ? "Editar Endereço" : "Adicionar Endereço" }}
  </h5>
  <button type="button" class="btn-close" (click)="close()"></button>
</div>

<div class="modal-body">
  <app-address-form
    [isModal]="true"
    [isEdit]="isEdit"
    [data]="data"
    [parentId]="parentId"
    [dialogRef]="dialogRef"
    [compact]="false"
  ></app-address-form>
</div>
