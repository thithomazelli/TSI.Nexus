<div class="vehicle-maintenance-form-wrapper">
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="modal-scrollable-area">
    <div class="row g-2">
      @if (!vehicleId) {
        <div class="col-12 col-md-6">
          <div class="input-group">
            <div class="form-floating flex-fill select-floating">
              <select formControlName="vehicleId" class="form-select" id="maintenanceVehicle">
                <option [ngValue]="null" disabled>{{ 'VEHICLES.SINGULAR' | translate }}</option>
                @for (vehicle of vehicles; track vehicle.id) {
                  <option [ngValue]="vehicle.id">{{ vehicle.plate }} - {{ vehicle.model }}</option>
                }
              </select>
              <label for="maintenanceVehicle">{{ 'VEHICLES.SINGULAR' | translate }}</label>
            </div>
            <div class="input-group-text"><i class="bi bi-bus-front"></i></div>
          </div>
        </div>
      }
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill select-floating">
            <select formControlName="type" class="form-select" id="maintenanceType">
              @for (option of typeOptions; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
            <label for="maintenanceType">{{ 'COMMON.TYPE' | translate }}</label>
          </div>
          <div class="input-group-text"><i class="bi bi-tools"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <app-date-field
          formControlName="scheduledDate"
          [label]="'VEHICLES.SCHEDULED_DATE' | translate"
        ></app-date-field>
      </div>
      <div class="col-12">
        <div class="input-group">
          <div class="form-floating flex-fill">
            <input
              formControlName="description"
              type="text"
              [placeholder]="'COMMON.DESCRIPTION' | translate"
              class="form-control"
              id="maintenanceDescription"
            />
            <label for="maintenanceDescription">{{ 'COMMON.DESCRIPTION' | translate }}</label>
          </div>
          <div class="input-group-text"><i class="bi bi-card-text"></i></div>
        </div>
      </div>
      <div class="col-12 col-md-6">
        <app-currency-field
          formControlName="cost"
          [label]="'VEHICLES.COST' | translate"
        ></app-currency-field>
      </div>
      <div class="col-12 col-md-6">
        <div class="input-group">
          <div class="form-floating flex-fill select-floating">
            <select formControlName="status" class="form-select" id="maintenanceStatus">
              @for (option of statusOptions; track option.value) {
                <option [value]="option.value">{{ option.label }}</option>
              }
            </select>
            <label for="maintenanceStatus">{{ 'COMMON.STATUS' | translate }}</label>
          </div>
          <div class="input-group-text"><i class="bi bi-info-circle"></i></div>
        </div>
      </div>
    </div>

    <app-product-picker-grid
      *ngIf="!isEdit"
      [items]="vehicleMaintenanceProducts"
      [filterOutOfStock]="true"
      (itemAdded)="onProductPickerItemAdded($event)"
      (itemRemoved)="removeProduct($event)"
    ></app-product-picker-grid>
    </div>

    <div class="d-flex justify-content-end mt-3">
      <button type="button" class="btn btn-secondary btn-sm me-2" (click)="cancel()">{{ 'COMMON.CANCEL' | translate }}</button>
      @if (isEdit) {
        <button (click)="remove()" type="button" class="btn btn-danger btn-sm me-2">{{ 'COMMON.REMOVE' | translate }}</button>
      }
      <button
        [appClick]="submit.bind(this)"
        type="submit"
        class="btn btn-success btn-sm"
      >
        {{ (isEdit ? 'COMMON.SAVE' : 'COMMON.ADD') | translate }}
      </button>
    </div>
  </form>
</div>
