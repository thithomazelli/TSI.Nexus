<div class="order-products-list">
  <app-grid
    [className]="'ORDER_PRODUCTS.ITEM_ENTITY' | translate"
    [compactView]="compact"
    [rowData]="rowData"
    [loading]="loading"
    [columnDefs]="columnDefs"
    [canAdd]="!isFromProductsView"
    [refresh]="refresh.bind(this)"
    [update]="noop.bind(this)"
    [delete]="isFromProductsView ? noop.bind(this) : deleteOrderProduct.bind(this)"
    (openModal)="openModal($event)"
  ></app-grid>
</div>
