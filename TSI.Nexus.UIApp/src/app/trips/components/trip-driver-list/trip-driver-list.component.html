<div class="trip-driver-list">
  <app-grid
    [className]="'TRIPS.DRIVERS_TAB' | translate"
    [compactView]="true"
    [rowData]="rowData"
    [columnDefs]="columnDefs"
    [canAdd]="true"
    [refresh]="refresh.bind(this)"
    [update]="noop.bind(this)"
    [delete]="deleteTripDriver.bind(this)"
    (openModal)="openModal($event)"
  ></app-grid>
</div>
