name: Build and Deploy

on:
  push:
    branches: [main, serodioturismo]
  workflow_dispatch:

jobs:
  # --- main branch: original deploy target -----------------------------------
  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TSI.Nexus.UIApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: TSI.Nexus.UIApp/dist/tsi.nexus.uiapp/browser/
          server-dir: /www/app/

  deploy-backend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish API (self-contained win-x64)
        run: >
          dotnet publish
          TSI.Nexus.WebAPI/src/TSI.Nexus.WebAPI/TSI.Nexus.WebAPI.csproj
          -c Release -r win-x64 --self-contained true
          -o publish/backend

      - name: Generate production web.config with secrets
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTIONSTRINGS_DEFAULT }}
          ConnectionStrings__HomologConnection: ${{ secrets.CONNECTIONSTRINGS_HOMOLOG }}
          JWT__Key: ${{ secrets.JWT_KEY }}
          MailJet__ApiKey: ${{ secrets.MAILJET_API_KEY }}
          MailJet__SecretKey: ${{ secrets.MAILJET_SECRET_KEY }}
        run: |
          envsubst < TSI.Nexus.WebAPI/src/TSI.Nexus.WebAPI/web.config.Production.example.xml > publish/backend/web.config

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: publish/backend/
          server-dir: /www/api/
          # Preserva dados gerados em runtime no servidor que não existem no build:
          # anexos enviados pelos usuários e logs do processo.
          exclude: |
            **/attachments/**
            **/stdout*

  # --- serodioturismo branch: separate FTP server (nexusoperations.com.br) ---
  deploy-frontend-serodio:
    if: github.ref == 'refs/heads/serodioturismo'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TSI.Nexus.UIApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build:serodio

      - name: Deploy to FTP
        # SamKirkland/FTP-Deploy-Action (Node/basic-ftp) reliably hit "ECONNRESET (data socket)"
        # on this host's very first data-connection operation of a sync, regardless of whether
        # the target directory already existed -- reproduced 4/4 times. Switched to lftp (mature,
        # battle-tested FTPS client) which handles this host's data channel correctly.
        #
        # --delete removes remote-only files so old content-hashed JS/CSS chunks and any leftover
        # web.config from a previous manual deploy don't linger indefinitely - safe here because
        # the frontend build output is fully reproducible from source, unlike the backend's
        # publish/ (see deploy-backend-serodio below), which has attachments/ and logs to protect.
        #
        # --ignore-time: mirror's default up-to-date check is size + mtime, but actions/checkout
        # gives every file a fresh mtime on every run, so the local copy always looks "newer" than
        # whatever's already on the FTP server even when the bytes are identical - unchanged
        # assets (images, etc.) were getting re-uploaded on every single deploy. Comparing by size
        # alone fixes that; content-hashed JS/CSS still transfer correctly whenever they actually
        # change, since a real content change gives them a new hashed filename (a different file
        # as far as mirror is concerned), not just a different mtime on the same name.
        #
        # Only the un-hashed root files (index.html, web.config, manifest.webmanifest) don't get
        # that "new filename on change" safety net - a same-byte-size edit to one of them could in
        # theory get skipped by a size-only comparison. Kept in a separate pass, size+mtime as
        # before (i.e. always re-uploaded, since local mtime is always fresh in CI), while
        # --ignore-time applies only to everything else - scoped to this frontend job, the backend
        # deploy below is untouched.
        env:
          LFTP_FTP_SERVER: ${{ secrets.SERODIO_FTP_SERVER }}
          LFTP_FTP_USERNAME: ${{ secrets.SERODIO_FTP_USERNAME }}
          LFTP_FTP_PASSWORD: ${{ secrets.SERODIO_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$LFTP_FTP_USERNAME","$LFTP_FTP_PASSWORD" "ftp://$LFTP_FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror -R --verbose --parallel=1 --no-perms --delete --include-glob=index.html --include-glob=web.config --include-glob=manifest.webmanifest --exclude-glob=* dist/tsi.nexus.uiapp/browser/ /www/serodio/;
            mirror -R --verbose --parallel=1 --no-perms --delete --ignore-time --exclude-glob=index.html --exclude-glob=web.config --exclude-glob=manifest.webmanifest dist/tsi.nexus.uiapp/browser/ /www/serodio/;
            bye
          "

  deploy-backend-serodio:
    if: github.ref == 'refs/heads/serodioturismo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish API (framework-dependent)
        # win-x64 self-contained isn't needed: the host already has the ASP.NET Core runtime
        # installed and launches via the shared "dotnet" command (see web.config.Production.example.xml).
        run: >
          dotnet publish
          TSI.Nexus.WebAPI/src/TSI.Nexus.WebAPI/TSI.Nexus.WebAPI.csproj
          -c Release
          -o publish/backend

      - name: Copy production web.config
        # Sem secrets, sem envsubst: ConnectionStrings/JWT/MailJet vivem só no appsettings.json
        # mantido manualmente no servidor (veja o exclude abaixo).
        run: |
          cp TSI.Nexus.WebAPI/src/TSI.Nexus.WebAPI/web.config.Production.Serodio.xml publish/backend/web.config

      - name: Deploy to FTP
        # SamKirkland/FTP-Deploy-Action (Node/basic-ftp) hits the same "ECONNRESET (data socket)"
        # this host gave the frontend job -- intermittent, not 100% reproducible here (this job had
        # succeeded twice before failing), but the frontend's fix (switch to lftp) removes the whole
        # class of flakiness, so applying it here too instead of just hoping a retry gets lucky.
        # lftp's mirror doesn't delete remote-only files unless --delete is passed (not used here),
        # so attachments/ and stdout* are naturally preserved with no extra flag; appsettings.json
        # DOES need an explicit exclude since dotnet publish copies it into publish/backend/ and it
        # would otherwise overwrite the real secrets kept manually on the server.
        #
        # Also hit "550 Access failed" on every .dll mid-mirror: the previous deploy's dotnet
        # process was still running and holding those files locked, because web.config (the file
        # that makes IIS/ANCM recycle the process) only gets overwritten near the END of the
        # mirror, by which point the DLLs earlier in the transfer order are already locked.
        # app_offline.htm is the standard IIS/ANCM fix -- ANCM watches for it and gracefully shuts
        # the process down (releasing the locks) as soon as it appears, so it has to land, and the
        # process has to actually exit, before the DLL mirror starts.
        env:
          LFTP_FTP_SERVER: ${{ secrets.SERODIO_FTP_SERVER }}
          LFTP_FTP_USERNAME: ${{ secrets.SERODIO_FTP_USERNAME }}
          LFTP_FTP_PASSWORD: ${{ secrets.SERODIO_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          echo '<html><body>Manutenção em andamento...</body></html>' > app_offline.htm
          lftp -u "$LFTP_FTP_USERNAME","$LFTP_FTP_PASSWORD" "ftp://$LFTP_FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            put app_offline.htm -o /www/serodio-api/app_offline.htm;
            !sleep 8;
            mirror -R --verbose --parallel=1 --no-perms --exclude-glob appsettings.json publish/backend/ /www/serodio-api/;
            rm -f /www/serodio-api/app_offline.htm;
            bye
          "
