name: Build and Deploy

on:
  push:
    branches: [main, serodioturismo]

jobs:
  # --- main branch: original deploy target -----------------------------------
  deploy-frontend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TSI.Friday.UIApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: TSI.Friday.UIApp/dist/tsi.friday.uiapp/browser/
          server-dir: /www/app/

  deploy-backend:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish API (self-contained win-x64)
        run: >
          dotnet publish
          TSI.Friday.WebAPI/src/TSI.Friday.WebAPI/TSI.Friday.WebAPI.csproj
          -c Release -r win-x64 --self-contained true
          -o publish/backend

      - name: Generate production web.config with secrets
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.CONNECTIONSTRINGS_DEFAULT }}
          ConnectionStrings__HomologConnection: ${{ secrets.CONNECTIONSTRINGS_HOMOLOG }}
          JWT__Key: ${{ secrets.JWT_KEY }}
          MailJet__ApiKey: ${{ secrets.MAILJET_API_KEY }}
          MailJet__SecretKey: ${{ secrets.MAILJET_SECRET_KEY }}
        run: |
          envsubst < TSI.Friday.WebAPI/src/TSI.Friday.WebAPI/web.config.Production.example.xml > publish/backend/web.config

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: publish/backend/
          server-dir: /www/api/
          # Preserva dados gerados em runtime no servidor que não existem no build:
          # anexos enviados pelos usuários e logs do processo.
          exclude: |
            **/attachments/**
            **/stdout*

  # --- serodioturismo branch: separate FTP server (nexusoperations.com.br) ---
  deploy-frontend-serodio:
    if: github.ref == 'refs/heads/serodioturismo'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TSI.Friday.UIApp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Deploy to FTP
        # SamKirkland/FTP-Deploy-Action (Node/basic-ftp) reliably hit "ECONNRESET (data socket)"
        # on this host's very first data-connection operation of a sync, regardless of whether
        # the target directory already existed -- reproduced 4/4 times. Switched to lftp (mature,
        # battle-tested FTPS client) which handles this host's data channel correctly.
        env:
          LFTP_FTP_SERVER: ${{ secrets.SERODIO_FTP_SERVER }}
          LFTP_FTP_USERNAME: ${{ secrets.SERODIO_FTP_USERNAME }}
          LFTP_FTP_PASSWORD: ${{ secrets.SERODIO_FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          lftp -u "$LFTP_FTP_USERNAME","$LFTP_FTP_PASSWORD" "ftpes://$LFTP_FTP_SERVER" -e "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set net:max-retries 3;
            set net:reconnect-interval-base 5;
            mirror -R --verbose --parallel=1 dist/tsi.friday.uiapp/browser/ /www/serodio-app/;
            bye
          "

  deploy-backend-serodio:
    if: github.ref == 'refs/heads/serodioturismo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish API (framework-dependent)
        # win-x64 self-contained isn't needed: the host already has the ASP.NET Core runtime
        # installed and launches via the shared "dotnet" command (see web.config.Production.example.xml).
        run: >
          dotnet publish
          TSI.Friday.WebAPI/src/TSI.Friday.WebAPI/TSI.Friday.WebAPI.csproj
          -c Release
          -o publish/backend

      - name: Copy production web.config
        # Sem secrets, sem envsubst: ConnectionStrings/JWT/MailJet vivem só no appsettings.json
        # mantido manualmente no servidor (veja o exclude abaixo).
        run: |
          cp TSI.Friday.WebAPI/src/TSI.Friday.WebAPI/web.config.Production.Serodio.xml publish/backend/web.config

      - name: Deploy to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SERODIO_FTP_SERVER }}
          username: ${{ secrets.SERODIO_FTP_USERNAME }}
          password: ${{ secrets.SERODIO_FTP_PASSWORD }}
          # Action defaults to plain "ftp" (no encryption); this host's FTP account only accepts
          # explicit FTPS logins (confirmed manually via FileZilla), so it's forced here.
          protocol: ftps
          local-dir: publish/backend/
          server-dir: /www/serodio-api/
          # Preserva dados gerados em runtime no servidor que não existem no build (anexos
          # enviados pelos usuários e logs do processo) e o appsettings.json mantido manualmente
          # no servidor com os dados sensíveis reais -- nunca deve ser sobrescrito por um deploy.
          exclude: |
            **/attachments/**
            **/stdout*
            **/appsettings.json
